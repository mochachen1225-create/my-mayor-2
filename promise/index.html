<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>一張支票（試玩）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
/* 配色、字型延續選戰篇 */
:root { --paper: #faf8f5; --ink: #2a2a2a; --muted: #7a7a7a; --room: #2b2f36; --red: #d93636; --gold: #e0a526; --green: #2e9e6a; --line: #e4e0da; }
@font-face { font-family: 'ColorEmoji'; src: local('Apple Color Emoji'), local('Segoe UI Emoji'), local('Noto Color Emoji'); unicode-range: U+1F000-1FAFF, U+2600-27BF, U+2B00-2BFF, U+FE0F; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: #1d2026; color: var(--ink); font-family: 'ColorEmoji', 'Huninn', 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; overscroll-behavior: none; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--paper); padding: 8px 12px 16px; position: relative; overflow: hidden; }
button { font-family: inherit; cursor: pointer; }
h1 { text-align: center; margin: 28px 0 4px; font-size: 28px; }
h2 { margin: 6px 0; font-size: 20px; }
.muted { color: var(--muted); font-size: 13px; }
.center { text-align: center; }
.btn { display: block; width: 100%; border: 0; border-radius: 999px; padding: 14px; margin: 10px 0; font-size: 17px; font-weight: 700; background: var(--room); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--room); }
.card { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 12px; margin: 10px 0; }
/* 支票進度：笑點在這裡 */
.promise { background: #fff; border: 2px dashed var(--room); border-radius: 14px; padding: 8px 10px; }
.promise .t { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px 8px; }
.stage { font-size: 20px; font-weight: 800; margin: 2px 0; display: flex; align-items: center; gap: 8px; }
.stage .pd { font-size: 12px; color: #8a5a00; font-weight: 400; }
.ladder { display: flex; gap: 3px; margin-top: 4px; }
.ladder i { flex: 1; height: 6px; border-radius: 3px; background: #eee; }
.ladder i.ok { background: var(--green); } .ladder i.now { background: var(--gold); animation: bob 1s infinite; }
.next { font-size: 12px; color: var(--muted); margin-top: 3px; }
@keyframes bob { 50% { opacity: .5; } }
.stage.back { color: var(--red); animation: shake .5s; }
.stage.up { color: var(--green); animation: pop .6s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes pop { 50% { transform: scale(1.12); } }
/* 人：記得你上次怎麼對他 */
.people { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 8px; }
.pp { text-align: center; font-size: 10px; position: relative; }
.pp img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #f3e6d0; border: 3px solid #ddd; }
.pp.g img { border-color: var(--green); } .pp.r img { border-color: var(--red); }
.pp .mf { position: absolute; top: -2px; right: 10px; font-size: 15px; }
.pp .tg { display: block; min-height: 13px; color: #8a5a00; }
.pp.hit { animation: pop .6s; }
.when { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }
/* 卡片 */
.stagebox { position: relative; height: 300px; margin-top: 8px; }
.cardx { position: absolute; inset: 0 6px; background: #fff; border: 3px solid var(--room); border-radius: 22px; padding: 14px 14px; text-align: center; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 8px 0 rgba(0,0,0,.08); transition: transform .25s; display: flex; flex-direction: column; align-items: center; }
.cardx.drag { transition: none; }
.cardx.out { transition: transform .3s, opacity .3s; opacity: 0; }
.cardx img { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; background: #f3e6d0; pointer-events: none; }
.cardx .who { font-weight: 800; margin-top: 6px; font-size: 14px; }
.cardx .who small { font-weight: 400; color: var(--muted); }
.cardx .txt { font-size: 18px; line-height: 1.55; margin-top: 8px; flex: 1; display: flex; align-items: center; }
.cardx.ev { border-color: var(--red); }
.choice { position: absolute; top: 12px; max-width: 46%; padding: 6px 10px; border-radius: 12px; font-weight: 800; font-size: 14px; background: var(--room); color: #fff; opacity: 0; transition: opacity .1s; pointer-events: none; }
.choice.l { right: 10px; } .choice.r { left: 10px; }
.btns { display: flex; gap: 8px; margin-top: 12px; }
.btns button { flex: 1; border: 2px solid var(--room); background: #fff; border-radius: 14px; padding: 8px 6px; font-size: 14px; font-weight: 700; color: var(--ink); min-height: 64px; line-height: 1.35; }
.btns button small { display: block; font-size: 11px; font-weight: 400; color: #8a5a00; margin-top: 3px; }
.react { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); background: var(--room); color: #fff; border-radius: 16px; padding: 10px 14px; font-size: 15px; max-width: 88vw; z-index: 30; animation: rup .25s; display: flex; gap: 8px; align-items: center; }
.react img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
@keyframes rup { from { transform: translate(-50%, 16px); opacity: 0; } }
.toast { position: fixed; left: 50%; top: 6px; transform: translateX(-50%); padding: 9px 16px; border-radius: 12px; font-size: 16px; font-weight: 800; z-index: 31; animation: fade 1.8s forwards; pointer-events: none; color: #fff; }
.toast.up { background: var(--green); } .toast.back { background: var(--red); } .toast.mid { background: var(--room); }
@keyframes fade { 0%, 75% { opacity: 1; } 100% { opacity: 0; } }
/* 結局卡（要好截圖） */
.end { background: #fff; border: 3px solid var(--room); border-radius: 22px; padding: 16px 14px; margin-top: 10px; }
.end .big { font-size: 22px; font-weight: 800; margin: 4px 0; }
.line { display: flex; gap: 4px; align-items: center; justify-content: center; margin: 8px 0; font-size: 13px; }
.line b { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--room); background: #fff; display: inline-block; }
.line b.cut { border-style: dashed; border-color: #bbb; }
.line i { width: 22px; height: 4px; background: var(--room); display: inline-block; }
.line i.cut { background: repeating-linear-gradient(90deg, #bbb 0 4px, transparent 4px 8px); }
.credit { display: flex; height: 22px; border-radius: 11px; overflow: hidden; margin: 6px 0 2px; font-size: 11px; color: #fff; }
.credit div { display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; }
.rows div { font-size: 14px; padding: 5px 0; border-bottom: 1px dashed #eee; text-align: left; }
.post { text-align: left; background: #f6f3ee; border-radius: 12px; padding: 8px 10px; font-size: 14px; margin-top: 10px; }
.post b { font-size: 12px; color: #6b5a33; display: block; }
/* v2：選主線、民意、交棒結局 */
.lines { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
.ln { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 10px 8px; text-align: left; font-size: 14px; color: var(--ink); position: relative; min-height: 78px; }
.ln small { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
.ln.on { border-color: var(--green); background: #eef8f1; }
.ln.on::after { content: '✓'; position: absolute; right: 8px; top: 6px; color: var(--green); font-weight: 800; }
.ln:disabled { opacity: .45; }
.pop { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 6px; }
.pop i { flex: 1; height: 8px; border-radius: 4px; background: #eee; overflow: hidden; display: block; }
.pop i b { display: block; height: 100%; transition: width .4s; }
.voice { position: fixed; left: 50%; bottom: 200px; transform: translateX(-50%); background: #fff; border: 2px solid var(--line); color: var(--ink); border-radius: 12px; padding: 6px 10px; font-size: 13px; max-width: 90vw; z-index: 29; animation: fade 2.2s forwards; pointer-events: none; }
.voice b { color: #6b5a33; font-size: 11px; display: block; }
.steps { text-align: left; margin: 8px 0; }
.steps div { font-size: 13px; padding: 3px 0; display: flex; gap: 6px; }
.steps div.ok { color: var(--green); } .steps div.now { color: #8a5a00; font-weight: 800; } .steps div.later { color: #999; }
.timeline { text-align: left; background: #f6f3ee; border-radius: 12px; padding: 8px 10px; font-size: 13px; margin-top: 8px; line-height: 1.7; }
.src { font-size: 11px; color: var(--muted); text-align: left; margin-top: 8px; line-height: 1.5; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// ==========================================================
// 一張支票 v2（試玩）— 選上了，才發現推不動
// 架構：開場選 2 條主線 → 每條照真實流程分關 → 民意線 → 市長交棒結局
// 這一版只開放「捷運延伸線」，其他主線之後一條一條做
// 摩卡與貓貓小隊
// ==========================================================
const $ = s => document.querySelector(s), app = $('#app');
const rnd = n => Math.floor(Math.random() * n), pick = a => a[rnd(a.length)];
const ART = '../fires/art/';
const TURNS = 16; // 一個決定＝一季，四年 16 季
const NEEDS = [3, 4, 4, 4, 3, 3]; // 每一關要推幾下（中央審查、規劃、環評最久）
const need = () => NEEDS[S.stage] || 3;
const SAVE = 'promise.v2';
let SV = (() => { try { return JSON.parse(localStorage.getItem(SAVE)) || {}; } catch (e) { return {}; } })();
const save = () => { try { localStorage.setItem(SAVE, JSON.stringify(SV)); } catch (e) {} };

// ---------- 主線清單（議題排名查證後再定；這一版只開放捷運）----------
const LINES = {
  metro: { e: '🚇', n: '捷運延伸線', promise: '四年內，捷運延伸線動工', open: true },
  housing: { e: '🏘️', n: '社會住宅', promise: '四年內，再蓋一萬戶社宅' },
  renew: { e: '🏚️', n: '老屋都更', promise: '危老公寓加速重建' },
  walk: { e: '🚸', n: '行人安全', promise: '終結行人地獄' },
  kids: { e: '👶', n: '托育', promise: '每區都有公共托嬰' },
  elder: { e: '🧓', n: '長照', promise: '長照據點走路 10 分鐘到' }
};
// ---------- 捷運主線：照真實流程分關（來源見 NOTES 和結局頁）----------
// 真實流程：整體路網評估 → 可行性研究（交通部審、行政院核定）→ 綜合規劃（含財務計畫、地方分擔，行政院核定）→ 環評、都市計畫變更 → 用地取得、設計 → 預算、發包 → 動工 → 通車
const STAGES = ['可行性研究', '中央核定可行性', '綜合規劃', '環評和都市計畫', '用地取得', '議會預算和發包', '動工', '通車'];
const YEARS_LEFT = [2, 1.5, 2, 1.5, 1.5, 1, 0, 8]; // 每關真實大約要幾年（萬大線、環狀線東環段的經驗值）
// 會來找你的人（各有盤算、記得你上次怎麼對他）
const P = {
  dir: { n: '高局長', role: '捷運工程局長・政務官', img: 'npc_foreign.webp', mind: '表面挺你，其實在看下一個位子' },
  chief: { n: '老陳', role: '規劃科科長・事務官', img: 'npc_staff.webp', mind: '在這裡待了 22 年，比你久' },
  coun: { n: '方議員', role: '沿線選區議員', img: 'C_m_flat.webp', mind: '什麼都可以談' },
  li: { n: '阿雪姨', role: '機廠預定地的里長', img: 'C_f_flat.webp', mind: '她的里民會不會被吵、會不會被徵收' }
};
const GUEST = { central: { n: '交通部官員', role: '中央審查', img: 'D_f_flat.webp' }, fin: { n: '主計處長', role: '市府管錢的人', img: 'B_f_flat.webp' }, res: { n: '里民代表', role: '說明會現場', img: 'E_m_flat.webp' } };
const WHO = k => P[k] || GUEST[k];
const METHOD = { press: '💪 施壓', credit: '🎖️ 給功勞', trade: '🤝 交換', concede: '✂️ 讓步', process: '⏳ 照程序', self: '🏃 自己來' };
const USERS = ['捷運通勤的阿凱', '早餐店阿姨', '外送員小陳', '退休國文老師', '三寶媽在線上', '熬夜的研究生', '機車族日常', '公車司機老張'];

// ---------- 狀態 ----------
let S;
function newGame(lines, keep) {
  S = { n: 0, stage: 0, push: 0, stations: 5, pop: 50, mood: { dir: 0, chief: 0, coun: 0, li: 0 }, credit: { dir: 0, coun: 0 }, debt: { dir: 0, coun: 0, li: 0, chief: 0 },
    pressed: {}, seen: {}, last: null, log: [], debtAt: {}, visits: {}, stuck: 0, lines, term: 1, unlocked: false };
  if (keep) Object.assign(S, keep, { n: 0, term: keep.term + 1, seen: { ...keep.seen }, last: null });
}
const when = () => { const n = Math.min(S.n, TURNS - 1), left = (TURNS - S.n) * 3; return `第 ${S.term > 1 ? S.term + ' 任第 ' : ''}${Math.floor(n / 4) + 1} 年・${'春夏秋冬'[n % 4]}　離選舉還有 ${left >= 12 ? Math.floor(left / 12) + ' 年' : ''}${left % 12 ? ' ' + left % 12 + ' 個月' : ''}`; };

// ---------- 捷運卡片 ----------
// 選項：t 文字、m 做法、push 推幾下、mood {人: ±}、pop 民意、credit [人, %]、debt 人、cut 砍站、back 退一關、react [人, 一句話]、voice 民眾的一句話
const SC = {
  0: [
    () => ({ who: 'dir', text: '市長放心，可行性研究我們全力推動！顧問公司已經在找了。',
      L: { t: '半年內要看到報告', m: 'press', push: 2, mood: { dir: -1 }, react: ['dir', '……是，市長。（笑容僵了一秒）'] },
      R: { t: '記者會你來講', m: 'credit', push: 2, credit: ['dir', 15], mood: { dir: 1 }, react: ['dir', '謝謝市長！我馬上約記者。'] } }),
    () => ({ who: 'chief', text: '報告市長，要先送整體路網評估，交通部才會收個別路線的可行性研究。',
      L: { t: '兩份一起送', m: 'press', push: 2, mood: { chief: -1 }, react: ['chief', '一起送？……（推了一下眼鏡）'] },
      R: { t: '好，照順序來', m: 'process', push: 1, mood: { chief: 1 }, react: ['chief', '市長很明理。'] } })
  ],
  1: [
    () => ({ who: 'central', text: '可行性研究的運量推估太樂觀了，請貴府再檢討。',
      L: { t: '找立委去部裡關心', m: 'trade', push: 2, debt: 'coun', mood: { coun: 1 }, react: ['coun', '我認識那個委員，包在我身上。'] },
      R: { t: '照意見修，重送', m: 'process', push: 1, pop: -1, voice: ['1999', '捷運到底要研究幾年？'], react: ['chief', '我們再修一版。'] } }),
    () => ({ who: 'dir', text: '交通部說要再開一次審查會，委員都是學者。',
      L: { t: '你去，簡報做漂亮一點', m: 'credit', push: 2, credit: ['dir', 10], mood: { dir: 1 }, react: ['dir', '我最會跟學者講話。'] },
      R: { t: '我親自去', m: 'self', push: 1, pop: 1, react: ['dir', '市長親自去？那……我陪您。'] } })
  ],
  2: [
    () => ({ who: 'fin', text: '綜合規劃要附財務計畫：自償率不夠，地方要分擔四成。',
      L: { t: '自籌就自籌，路線砍一站', m: 'concede', push: 2, cut: 1, pop: -2, voice: ['脆', '我家那站被砍了？選前不是這樣說的'], react: ['fin', '那其他預算要排到後面了。'] },
      R: { t: '站旁土地開發來補', m: 'trade', push: 2, debt: 'coun', pop: -1, voice: ['脆', '又是開發商？'], react: ['coun', '那幾塊地，我熟。'] } }),
    () => ({ who: 'chief', text: '綜合規劃第三版，顧問公司說還要再修。',
      L: { t: '這週定稿，不准再改', m: 'press', push: 2, mood: { chief: -1 }, react: ['chief', '（在筆記本上寫了什麼）'] },
      R: { t: '到底卡在哪？我聽你說', m: 'process', push: 1, mood: { chief: 1 }, react: ['chief', '市長是第一個問我的。'] } })
  ],
  3: [
    () => ({ who: 'li', text: '機廠要蓋在我們里？說明會我會帶三百人去。',
      L: { t: '出口開在你們市場前', m: 'trade', push: 2, debt: 'li', mood: { li: 1 }, react: ['li', '這還差不多。你說的喔。'] },
      R: { t: '機廠移走，路線少一站', m: 'concede', push: 2, cut: 1, mood: { li: 1 }, pop: -1, react: ['li', '好啦。隔壁里的你自己去處理。'] } }),
    () => ({ who: 'res', text: '（說明會現場）「我們不要機廠！」「施工十年誰負責？」「我家會不會被徵收？」', ev2: 1,
      L: { t: '站上台，一題一題回答', m: 'self', push: 1, pop: 2, mood: { li: 1 }, voice: ['脆', '市長被罵了兩個小時都沒走，有點佩服'], react: ['li', '至少你有來。'] },
      R: { t: '讓局長去，我不出席', m: 'credit', push: 2, pop: -3, credit: ['dir', 5], voice: ['脆', '市長連說明會都不敢來？'], react: ['dir', '我……會努力。'] } }),
    () => ({ who: 'chief', text: '都發局說都市計畫變更要再開一次委員會，環評委員說要補噪音模擬。',
      L: { t: '兩個委員會我親自去拜託', m: 'self', push: 1, mood: { chief: 1 }, react: ['chief', '市長要親自去？……好。'] },
      R: { t: '下個月就要通過', m: 'press', push: 2, mood: { chief: -1, dir: -1 }, react: ['chief', '委員不是我們能決定的……'] } })
  ],
  4: [
    () => ({ who: 'li', text: '要徵收的那幾戶，有一戶是阿伯住了五十年的房子。',
      L: { t: '依法徵收', m: 'press', push: 2, pop: -3, mood: { li: -2 }, voice: ['脆', '強拆阿伯的房子？這就是市府？'], react: ['li', '依法？好，你給我記住。'] },
      R: { t: '我去阿伯家坐坐', m: 'self', push: 1, pop: 2, mood: { li: 1 }, voice: ['脆', '市長去阿伯家吃飯的影片好暖'], react: ['li', '阿伯說要再想想，但他煮了湯給你。'] } }),
    () => ({ who: 'dir', text: '有一塊是國營事業的地，他們說要再研議。',
      L: { t: '你去喬，功勞算你', m: 'credit', push: 2, credit: ['dir', 10], mood: { dir: 1 }, react: ['dir', '交給我，我學長在那邊。'] },
      R: { t: '請中央協調', m: 'process', push: 1, react: ['central', '我們會轉請相關單位研議。'] } })
  ],
  5: [
    () => ({ who: 'coun', text: '捷運預算要過，我選區的活動中心也要排進去喔。',
      L: { t: '可以，一起排', m: 'trade', push: 2, debt: 'coun', mood: { coun: 1 }, react: ['coun', '市長爽快！'] },
      R: { t: '捷運是捷運，活動中心另案', m: 'process', push: 1, mood: { coun: -1 }, react: ['coun', '那我們就……慢慢審。'] } }),
    () => ({ who: 'dir', text: '第一次招標流標，沒有廠商來投。料工都在漲。',
      L: { t: '提高預算再招', m: 'concede', push: 2, pop: -1, voice: ['脆', '又追加預算？'], react: ['fin', '錢從哪裡來，我再想辦法。'] },
      R: { t: '拆成小標案再招', m: 'process', push: 1, react: ['chief', '拆標要重新審，又是幾個月。'] } })

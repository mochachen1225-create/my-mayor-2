<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>一張支票（試玩 v3）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
/* 配色、字型延續選戰篇 */
:root { --paper: #faf8f5; --ink: #2a2a2a; --muted: #7a7a7a; --room: #2b2f36; --red: #d93636; --gold: #e0a526; --green: #2e9e6a; --line: #e4e0da; }
@font-face { font-family: 'ColorEmoji'; src: local('Apple Color Emoji'), local('Segoe UI Emoji'), local('Noto Color Emoji'); unicode-range: U+1F000-1FAFF, U+2600-27BF, U+2B00-2BFF, U+FE0F; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: #1d2026; color: var(--ink); font-family: 'ColorEmoji', 'Huninn', 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; overscroll-behavior: none; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--paper); padding: 8px 12px 16px; position: relative; overflow: hidden; }
button { font-family: inherit; cursor: pointer; }
h1 { text-align: center; margin: 28px 0 4px; font-size: 28px; }
h2 { margin: 6px 0; font-size: 20px; }
.muted { color: var(--muted); font-size: 13px; }
.center { text-align: center; }
.btn { display: block; width: 100%; border: 0; border-radius: 999px; padding: 14px; margin: 10px 0; font-size: 17px; font-weight: 700; background: var(--room); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--room); }
.card { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 12px; margin: 10px 0; }
/* 支票進度：笑點在這裡 */
.promise { background: #fff; border: 2px dashed var(--room); border-radius: 14px; padding: 8px 10px; }
.promise .t { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px 8px; }
.stage { font-size: 20px; font-weight: 800; margin: 2px 0; display: flex; align-items: center; gap: 8px; }
.stage .pd { font-size: 12px; color: #8a5a00; font-weight: 400; }
.ladder { display: flex; gap: 3px; margin-top: 4px; }
.ladder i { flex: 1; height: 6px; border-radius: 3px; background: #eee; }
.ladder i.ok { background: var(--green); } .ladder i.now { background: var(--gold); animation: bob 1s infinite; }
.next { font-size: 12px; color: var(--muted); margin-top: 3px; }
@keyframes bob { 50% { opacity: .5; } }
.stage.back { color: var(--red); animation: shake .5s; }
.stage.up { color: var(--green); animation: pop .6s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes pop { 50% { transform: scale(1.12); } }
/* 人：記得你上次怎麼對他 */
.people { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 8px; }
.pp { text-align: center; font-size: 10px; position: relative; }
.pp img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #f3e6d0; border: 3px solid #ddd; }
.pp.g img { border-color: var(--green); } .pp.r img { border-color: var(--red); }
.pp .mf { position: absolute; top: -2px; right: 10px; font-size: 15px; }
.pp .tg { display: block; min-height: 13px; color: #8a5a00; }
.pp.hit { animation: pop .6s; }
.when { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }
/* 卡片 */
.stagebox { position: relative; height: 300px; margin-top: 8px; }
.cardx { position: absolute; inset: 0 6px; background: #fff; border: 3px solid var(--room); border-radius: 22px; padding: 14px 14px; text-align: center; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 8px 0 rgba(0,0,0,.08); transition: transform .25s; display: flex; flex-direction: column; align-items: center; }
.cardx.drag { transition: none; }
.cardx.out { transition: transform .3s, opacity .3s; opacity: 0; }
.cardx img { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; background: #f3e6d0; pointer-events: none; }
.cardx .who { font-weight: 800; margin-top: 6px; font-size: 14px; }
.cardx .who small { font-weight: 400; color: var(--muted); }
.cardx .txt { font-size: 18px; line-height: 1.55; margin-top: 8px; flex: 1; display: flex; align-items: center; }
.cardx.ev { border-color: var(--red); }
.choice { position: absolute; top: 12px; max-width: 46%; padding: 6px 10px; border-radius: 12px; font-weight: 800; font-size: 14px; background: var(--room); color: #fff; opacity: 0; transition: opacity .1s; pointer-events: none; }
.choice.l { right: 10px; } .choice.r { left: 10px; }
.btns { display: flex; gap: 8px; margin-top: 12px; }
.btns button { flex: 1; border: 2px solid var(--room); background: #fff; border-radius: 14px; padding: 8px 6px; font-size: 14px; font-weight: 700; color: var(--ink); min-height: 64px; line-height: 1.35; }
.btns button small { display: block; font-size: 11px; font-weight: 400; color: #8a5a00; margin-top: 3px; }
.react { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); background: var(--room); color: #fff; border-radius: 16px; padding: 10px 14px; font-size: 15px; max-width: 88vw; z-index: 30; animation: rup .25s; display: flex; gap: 8px; align-items: center; }
.react img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
@keyframes rup { from { transform: translate(-50%, 16px); opacity: 0; } }
.toast { position: fixed; left: 50%; top: 6px; transform: translateX(-50%); padding: 9px 16px; border-radius: 12px; font-size: 16px; font-weight: 800; z-index: 31; animation: fade 1.8s forwards; pointer-events: none; color: #fff; }
.toast.up { background: var(--green); } .toast.back { background: var(--red); } .toast.mid { background: var(--room); }
@keyframes fade { 0%, 75% { opacity: 1; } 100% { opacity: 0; } }
/* 結局卡（要好截圖） */
.end { background: #fff; border: 3px solid var(--room); border-radius: 22px; padding: 16px 14px; margin-top: 10px; }
.end .big { font-size: 22px; font-weight: 800; margin: 4px 0; }
.line { display: flex; gap: 4px; align-items: center; justify-content: center; margin: 8px 0; font-size: 13px; }
.line b { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--room); background: #fff; display: inline-block; }
.line b.cut { border-style: dashed; border-color: #bbb; }
.line i { width: 22px; height: 4px; background: var(--room); display: inline-block; }
.line i.cut { background: repeating-linear-gradient(90deg, #bbb 0 4px, transparent 4px 8px); }
.credit { display: flex; height: 22px; border-radius: 11px; overflow: hidden; margin: 6px 0 2px; font-size: 11px; color: #fff; }
.credit div { display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; }
.rows div { font-size: 14px; padding: 5px 0; border-bottom: 1px dashed #eee; text-align: left; }
.post { text-align: left; background: #f6f3ee; border-radius: 12px; padding: 8px 10px; font-size: 14px; margin-top: 10px; }
.post b { font-size: 12px; color: #6b5a33; display: block; }
/* v3：前任的桌上、多條線、關係後果 */
.desk { display: flex; flex-direction: column; gap: 4px; }
.lrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; font-size: 12px; }
.lrow b { font-size: 13px; }
.lrow .sit { font-size: 10px; color: var(--muted); }
.lrow .ladder { grid-column: 1 / 3; margin-top: 0; }
.lrow.cur b { color: #8a5a00; }
.bars2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; font-size: 12px; }
.bars2 i { display: block; height: 7px; border-radius: 4px; background: #eee; overflow: hidden; margin-top: 2px; }
.bars2 i b { display: block; height: 100%; transition: width .4s; }
.memo { background: #fff3f3; border: 2px solid #f1c0c0; color: #8a2a2a; border-radius: 10px; padding: 4px 8px; font-size: 12px; margin-bottom: 4px; width: 100%; }
.memo.fav { background: #f3f8ff; border-color: #bcd3f0; color: #2a4a7a; }
.cardx .ln { font-size: 11px; color: var(--muted); margin-top: 2px; }
.cardx .head { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; }
.cardx .head img { width: 56px; height: 56px; flex: none; }
.cardx .head .who { margin-top: 0; }
.stagebox { height: 250px; }
.folder { background: #fff8e8; border: 2px solid #e8d3a2; border-radius: 12px; padding: 10px; margin: 8px 0; text-align: left; font-size: 14px; }
.folder small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
.voice { position: fixed; left: 50%; bottom: 200px; transform: translateX(-50%); background: #fff; border: 2px solid var(--line); color: var(--ink); border-radius: 12px; padding: 6px 10px; font-size: 13px; max-width: 90vw; z-index: 29; animation: fade 2.2s forwards; pointer-events: none; }
.voice b { color: #6b5a33; font-size: 11px; display: block; }
.lineend { text-align: left; border-bottom: 1px dashed #eee; padding: 8px 0; font-size: 14px; }
.lineend small { display: block; color: var(--muted); font-size: 12px; }
.timeline { text-align: left; background: #f6f3ee; border-radius: 12px; padding: 8px 10px; font-size: 13px; margin-top: 8px; line-height: 1.7; }
.src { font-size: 11px; color: var(--muted); text-align: left; margin-top: 8px; line-height: 1.5; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// ==========================================================
// 一張支票 v3（試玩）— 前任的桌上
// 上任時桌上有 2～3 條捷運線，各在不同階段；每張卡是一個有內容的兩難。
// 關係只記具體的事，之後一定在某張卡被提起、改變那張卡；結局只列真的影響過什麼。
// 卡片原型和真實出處：docs/promise-v3-cards.md
// 摩卡與貓貓小隊
// ==========================================================
const $ = s => document.querySelector(s), app = $('#app');
const rnd = n => Math.floor(Math.random() * n), pick = a => a[rnd(a.length)], shuffle = a => a.slice().sort(() => Math.random() - .5);
const ART = '../fires/art/';
const TURNS = 16; // 一個決定＝一季，四年 16 季

// ---------- 人 ----------
const P = {
  dir: { n: '高局長', role: '捷運工程局長・政務官', img: 'npc_foreign.webp', mind: '表面挺你，其實在看下一個位子' },
  chief: { n: '老陳', role: '規劃科科長・事務官', img: 'npc_staff.webp', mind: '在這裡待了 22 年，比你久' },
  coun: { n: '方議員', role: '議員・前任同黨', img: 'C_m_flat.webp', mind: '什麼都可以談，但會記帳' },
  li: { n: '阿雪姨', role: '里長', img: 'C_f_flat.webp', mind: '里民會不會被吵、會不會被徵收' }
};
const GUEST = { fin: { n: '主計處長', role: '市府管錢的人', img: 'B_f_flat.webp' }, central: { n: '交通部官員', role: '中央審查', img: 'D_f_flat.webp' }, reporter: { n: '記者小葉', role: '跑市政線', img: 'npc_reporter.webp' }, res: { n: '自救會會長', role: '沿線居民', img: 'E_m_flat.webp' }, nb: { n: '鄰市副市長', role: '跨市那段', img: 'F_m_flat.webp' }, epa: { n: '環評委員', role: '環評審查會', img: 'npc_pundit.webp' } };
const WHO = k => P[k] || GUEST[k];

// ---------- 前任的桌上：四種狀況（每局抽 2～3 種）----------
const LINES = {
  A: { n: '城西線', sit: '前任留下、已經在動工', stages: ['施工中', '追加預算', '完工測試', '通車'], yrs: [2, 1, 1, 0], start: '前任剪過綵的線，工地已經圍了五年。' },
  B: { n: '河岸線', sit: '這一任要拍板', stages: ['可行性研究', '中央核定', '綜合規劃', '環評和都市計畫', '動工'], yrs: [2, 1.5, 2, 1.5, 8], start: '路線、高架或地下、錢從哪來，都要你決定。' },
  C: { n: '北區線', sit: '前任說要做，只有一頁簡報', stages: ['一頁簡報', '整體路網評估', '可行性研究', '中央核定', '綜合規劃'], yrs: [1, 1.5, 2, 1.5, 2], start: '競選海報上畫得很漂亮。' },
  D: { n: '東區段', sit: '市區段，社區意見分裂', stages: ['環評和都市計畫', '用地取得', '議會預算和發包', '動工'], yrs: [2, 1.5, 1, 8], start: '核定了很多年，卡在經過老社區的那一段。' }
};

// ---------- 卡片（照 docs/promise-v3-cards.md）----------
// 選項：t 文字、adv 進度、pop 民意、money 財政、st 站數、grudge [人, 具體的事]、favor [人, 具體的事]、credit 人、flag、q [卡, 幾張後]、react [人, 一句話]、voice
// tags：budget（記恨的議員會在這裡卡你）、hearing（記恨的里長會帶人來）
const CARDS = {
  // A 已在動工
  A1: { line: 'A', who: 'fin', tags: ['budget'], text: '前任那條在蓋的線，料工雙漲，要追加一百多億。中央說要等修正計畫核定，才撥一部分。',
    L: { t: '送議會追加預算', q: ['A1b', 1], react: ['fin', '那就看議會了。'] },
    R: { t: '一站改「預留站」先不蓋', adv: 1, st: -1, q: ['A1r', 5], pop: -2, voice: ['脆', '我家那站變「預留站」？預留到什麼時候？'], react: ['fin', '帳是平了。那一站的里長會來找你。'] } },
  A1b: { line: 'A', who: 'coun', tags: ['budget'], text: '追加預算可以過。我選區的活動中心，也要排進去喔。',
    L: { t: '好，一起排', adv: 1, money: -6, favor: ['coun', '幫你把城西線追加預算喬過'], react: ['coun', '市長爽快。我記住了。'] },
    R: { t: '工程是工程，活動中心另案', grudge: ['coun', '你拒絕了他的活動中心'], q: ['A1c', 2], react: ['coun', '那就……慢慢審。'] } },
  A1c: { line: 'A', who: 'dir', tags: ['budget'], text: '追加預算卡在議會，城西線工地下個月要停工了。',
    L: { t: '再去議會協商', adv: 1, money: -6, pop: -1, react: ['coun', '早這樣不就好了。'] },
    R: { t: '動用第二預備金先撐', adv: 1, money: -14, voice: ['脆', '預備金是拿來救災的吧？'], react: ['fin', '預備金用完，颱風季就沒有了。'] } },
  A1r: { line: 'A', who: 'li', text: '我們的站呢？「預留站」是要預留到什麼時候？里民天天來問。',
    L: { t: '之後一定補', pop: -4, effect: '那一站的里長年年陳情', react: ['li', '「之後」是多久？'] },
    R: { t: '先蓋簡易站', money: -8, st: 1, react: ['li', '這還差不多。'] } },
  A2: { line: 'A', who: 'dir', text: '潛盾機隧道工地出事，一位工人受重傷。勞檢處要求事故工區停工。', serious: 1,
    L: { t: '全線停工總體檢', pop: 1, hold: 2, effect: '城西線延了半年，但之後沒人能翻這筆帳', react: ['dir', '我馬上安排。'] },
    R: { t: '只停事故工區，其他照進度', adv: 1, q: ['A2r', 4], react: ['dir', '其他工區照常。'] } },
  A2r: { line: 'A', who: 'reporter', text: '城西線又出事了。議會要市長親自到場專案報告，大家都在問上次為什麼沒全面檢查。', serious: 1,
    L: { t: '親自到議會報告', pop: -3, effect: '上次只停事故工區的決定被翻出來', react: ['coun', '市長終於來了。'] },
    R: { t: '讓局長去報告', pop: -6, effect: '被罵不敢面對', react: ['dir', '……我去。'] } },
  A3: { line: 'A', who: 'reporter', text: '城西線原本說好幾年前就要完工，現在又延。市民問：到底誰負責？',
    L: { t: '「這是前任的規劃」', grudge: ['coun', '你說延宕是前任的規劃'], react: ['coun', '（前任同黨的他，臉色很難看）'] },
    R: { t: '「我負責，公布新時程」', pop: -4, flag: 'promiseA', react: ['reporter', '新時程我記下來了喔。'] } },
  // B 這一任要拍板
  B4: { line: 'B', who: 'dir', text: '河岸線有兩案。A 走老社區，人多、運量高，但要拆不少房子；B 沿河濱，便宜又快，但車站離住家遠。',
    L: { t: 'A 案：走老社區', adv: 1, flag: 'routeA', q: ['B4a', 4], react: ['dir', '運量好看，但用地那關會很難。'] },
    R: { t: 'B 案：沿河濱', adv: 2, flag: 'routeB', effect: '快又便宜，但將來運量可能只有預估的六成', react: ['dir', '這樣快很多。'] } },
  B4a: { line: 'B', who: 'li', tags: ['hearing'], text: '河岸線要拆的那幾戶，說徵收價太低。說明會吵翻了。',
    L: { t: '多開兩場說明會', pop: 2, react: ['li', '至少你願意聽。'] },
    R: { t: '依法徵收', adv: 1, pop: -5, grudge: ['li', '你依法徵收了河岸線的拆遷戶'], voice: ['脆', '依法徵收阿伯住了五十年的房子？'], react: ['li', '依法？好，你給我記住。'] } },
  B5: { line: 'B', who: 'chief', text: '高架便宜一半、快三年，但沿線住戶窗外就是軌道。地下要穿過民宅底下，貴很多，還要補償被穿越的人。',
    L: { t: '高架', adv: 1, q: ['B5e', 3], react: ['chief', '那出土段要選好。'] },
    R: { t: '地下', adv: 1, money: -15, q: ['B5u', 3], react: ['chief', '那預算要先跟主計處講。'] } },
  B5e: { line: 'B', who: 'res', tags: ['hearing'], text: '出土段旁邊的住戶組了自救會，說施工振動和噪音會毀了他們的家。',
    L: { t: '加隔音牆、浮動道床', money: -6, pop: 1, react: ['res', '你要寫進契約裡。'] },
    R: { t: '照環評結論施工', adv: 1, pop: -4, grudge: ['li', '你沒理出土段的自救會'], react: ['li', '我們里的人都在看。'] } },
  B5u: { line: 'B', who: 'fin', text: '地下化太貴了。其他線的預算，要排到後面。',
    L: { t: '排就排', other: -1, effect: '排擠了其他線的預算，進度退了一格', react: ['fin', '我會跟其他局處說。'] },
    R: { t: '發債', money: 12, pop: -3, voice: ['脆', '市府又要舉債？'], react: ['coun', '議會會質詢你舉債喔。'] } },
  B6: { line: 'B', who: 'central', tags: ['budget'], text: '地方財力級次調整了。貴府的財務計畫，要重算自償率和中央補助比例。',
    L: { t: '照意見重算再送', q: ['B6ok', 3], react: ['chief', '重算要幾個月。'] },
    R: { t: '市府先自籌，不等', adv: 1, money: -12, pop: -1, react: ['fin', '其他建設要往後排了。'] } },
  B6ok: { line: 'B', who: 'central', text: '財務計畫重算後核定了，中央補助比例確定。',
    L: { t: '謝謝中央', adv: 1, react: ['chief', '這次快了。'] },

// ---------- 狀態 ----------
let S;
function newGame() {
  const keys = shuffle(['A', 'B', 'C', 'D']).slice(0, Math.random() < .7 ? 3 : 2);
  S = { n: 0, pop: 50, money: 50, lines: {}, order: keys, q: [], used: {}, rel: [], fx: [], flags: {}, turn: 0, last: null };
  keys.forEach(k => S.lines[k] = { stage: 0, stations: 5, hold: 0, cap: 99, core: CORE[k].slice() });
}
const when = () => { const n = Math.min(S.n, TURNS - 1), left = (TURNS - S.n) * 3; return `第 ${Math.floor(n / 4) + 1} 年・${'春夏秋冬'[n % 4]}　離選舉還有 ${left >= 12 ? Math.floor(left / 12) + ' 年' : ''}${left % 12 ? ' ' + left % 12 + ' 個月' : ''}`; };
const pushQ = (id, d, parent) => S.q.push({ id, at: S.n + d, parent });
const whenN = n => `第 ${Math.floor(n / 4) + 1} 年${'春夏秋冬'[n % 4]}`;
// 結局用的「你做了什麼 → 誰怎麼回應 → 結果」；同一件事（key 相同）接在同一條後面
function addFx(key, full, tail) { const e = key && S.fx.find(x => x.key === key); if (e) e.text += ' → ' + tail; else S.fx.push({ key, text: full }); }

function nextCard() {
  // 1. 之前的決定回來了
  const due = S.q.findIndex(x => x.at <= S.n && S.lines[CARDS[x.id].line]);
  if (due >= 0) { const x = S.q.splice(due, 1)[0]; return { ...CARDS[x.id], parent: x.parent }; }
  // 2. 人情回來討
  const f = S.rel.find(r => r.kind === 'favor' && !r.done && S.n - r.n >= 3);
  if (f && Math.random() < .6) return collectCard(f);
  // 3. 輪流看每條線的下一張卡
  for (let i = 0; i < S.order.length; i++) {
    const lk = S.order[(S.turn + i) % S.order.length], L = S.lines[lk];
    if (L.core.length) { S.turn = (S.turn + i + 1) % S.order.length; return { ...CARDS[L.core.shift()] }; }
  }
  // 4. 日常
  const lk = S.order[S.turn % S.order.length]; S.turn++;
  return routineCard(lk);
}

const USERS = ['捷運通勤的阿凱', '早餐店阿姨', '外送員小陳', '退休國文老師', '三寶媽在線上', '熬夜的研究生', '機車族日常', '公車司機老張'];

  const rank = n => ['你之後的下一任', '你之後第二任', '你之後第三任', '你之後第四任', '你之後第五任'][Math.min(4, n - 1)];
  const rows = S.order.map(k => {
    const ln = LINES[k], L = S.lines[k], last = ln.stages.length - 1, done = L.stage >= last;
    // 剩下的關卡照真實經驗值估年數；北區線的最後一關之後還有環評、用地、預算、動工到通車（約 12 年）
    const yrs = Math.round(ln.yrs.slice(L.stage).reduce((a, b) => a + b, 0) + (k === 'C' ? 12 : 0));
    let tl;
    if (k === 'A' && done) tl = `你任內通車了。典禮上司儀說：「感謝前任市長的遠見。」你站在第二排。`;
    else if (k === 'A') tl = `你卸任後 ${Math.max(1, yrs)} 年通車，剪綵的是${rank(1)}市長。`;
    else { const y = Math.max(1, yrs); tl = `你卸任後大約 ${y} 年通車，剪綵的是${rank(Math.ceil(y / 4))}市長。他說：「感謝歷任市長的努力。」`; }
    if (k === 'A' && S.flags.promiseA) tl += done ? '（你公布的新時程準時兌現，那段影片被翻出來加分。）' : '（你當年公布的新時程到了，記者重播了那段影片。）';
    if (k === 'B' && S.flags.routeB) tl += '通車後運量只有預估的六成，脆上叫它「河濱觀光線」。';
    return `<div class="lineend"><b>📂 ${ln.n}</b>　${done ? '✅' : '⏳'} 推到「${ln.stages[L.stage]}」<small>${ln.sit}・${L.stations < 5 ? `5 站剩 ${L.stations} 站・` : ''}${tl}</small></div>`;
  }).join('');
  const fx = S.fx.map(x => x.text);
  let cm;
  const reached = S.order.reduce((a, k) => a + S.lines[k].stage, 0);
  if (reached <= 2) cm = '四年過去了，桌上的卷宗還是那幾疊。';
  else if (fx.length >= 5) cm = '四年推了好幾關，也欠了一屁股人情、得罪了一堆人。';
  else if (S.pop >= 60) cm = '說真的，這任市長有在推。';
  else cm = '每一條都在動，每一條都還沒好。';
  app.innerHTML = `<div class="end center"><div class="muted">📂 前任的桌上，四年後</div><div class="big">你卸任了</div>
    ${rows}
    <div style="text-align:left;margin-top:10px;font-size:13px"><b>這四年真的影響過什麼</b></div>
    <div class="rows">${fx.length ? fx.map(x => `<div>• ${x}</div>`).join('') : '<div>沒有人卡你，也沒有人幫你。（這也很少見）</div>'}</div>
    <div class="rows"><div>😊 卸任時民意 ${Math.round(S.pop)}・💰 財政 ${Math.round(S.money)}${S.money < 0 ? '（舉債中）' : ''}</div></div>
    <div class="post"><b>🧵 脆上的評語</b>${cm}</div>
    <div class="src">真實世界的參考：一條捷運從核定到通車常常要 9～17 年；卡片的原型和出處列在 docs/promise-v3-cards.md。</div>
    <div class="muted" style="margin-top:8px">《我推的市長》試玩・摩卡與貓貓小隊</div></div>
    <button class="btn" id="again">再接一次前任的桌子</button>`;
  $('#again').onclick = () => { desk(); };
}

// ---------- 開場：前任的桌上 ----------
function desk() {
  newGame();
  app.innerHTML = `<h2 style="margin-top:18px">📂 前任的桌上</h2><p class="muted">你選上市長了。第一天進辦公室，桌上留著這幾疊卷宗：</p>
    ${S.order.map(k => `<div class="folder">📂 <b>${LINES[k].n}</b>・${LINES[k].sit}<small>${LINES[k].start}</small></div>`).join('')}
    <p class="muted">四年 16 季。每件事都有人帶著問題來找你，左右都說得通，也都有代價。誰記得你什麼，之後會回來。</p>
    <button class="btn" id="go">開始辦公 →</button>`;
  $('#go').onclick = render;
}
function title() {
  app.innerHTML = `<h1>📜 一張支票</h1><p class="center muted">《我推的市長》試玩 v3・前任的桌上・約 4 分鐘</p>
    <div class="card"><p><b>你選上市長了。</b></p><p>你以為一切從零開始。其實前任的桌上，已經有好幾條捷運線：有的在蓋、有的等你拍板、有的只有一頁簡報、有的社區吵成兩派。</p></div>
    <div class="people" style="margin:14px 0">${Object.keys(P).map(k => `<div class="pp"><img src="${face(k)}" alt=""><br>${P[k].n}<br><span class="muted" style="font-size:10px">${P[k].role}</span></div>`).join('')}</div>
    <button class="btn" id="go">上任 →</button><p class="center muted">人物、城市、路線全部虛構・摩卡與貓貓小隊<br>舊版：<a href="v1.html" style="color:inherit">v1</a>・<a href="v2.html" style="color:inherit">v2</a></p>`;
  $('#go').onclick = desk;
}
document.addEventListener('keydown', e => { if (!CUR) return; if (e.key === 'ArrowLeft') choose('L'); if (e.key === 'ArrowRight') choose('R'); });
title();

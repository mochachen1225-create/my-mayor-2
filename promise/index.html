<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>一張支票（試玩切片）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
/* 配色、字型延續選戰篇 */
:root { --paper: #faf8f5; --ink: #2a2a2a; --muted: #7a7a7a; --room: #2b2f36; --red: #d93636; --gold: #e0a526; --green: #2e9e6a; --line: #e4e0da; }
@font-face { font-family: 'ColorEmoji'; src: local('Apple Color Emoji'), local('Segoe UI Emoji'), local('Noto Color Emoji'); unicode-range: U+1F000-1FAFF, U+2600-27BF, U+2B00-2BFF, U+FE0F; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: #1d2026; color: var(--ink); font-family: 'ColorEmoji', 'Huninn', 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; overscroll-behavior: none; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--paper); padding: 8px 12px 16px; position: relative; overflow: hidden; }
button { font-family: inherit; cursor: pointer; }
h1 { text-align: center; margin: 28px 0 4px; font-size: 28px; }
h2 { margin: 6px 0; font-size: 20px; }
.muted { color: var(--muted); font-size: 13px; }
.center { text-align: center; }
.btn { display: block; width: 100%; border: 0; border-radius: 999px; padding: 14px; margin: 10px 0; font-size: 17px; font-weight: 700; background: var(--room); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--room); }
.card { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 12px; margin: 10px 0; }
/* 支票進度：笑點在這裡 */
.promise { background: #fff; border: 2px dashed var(--room); border-radius: 14px; padding: 8px 10px; }
.promise .t { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px 8px; }
.stage { font-size: 20px; font-weight: 800; margin: 2px 0; display: flex; align-items: center; gap: 8px; }
.stage .pd { font-size: 12px; color: #8a5a00; font-weight: 400; }
.ladder { display: flex; gap: 3px; margin-top: 4px; }
.ladder i { flex: 1; height: 6px; border-radius: 3px; background: #eee; }
.ladder i.ok { background: var(--green); } .ladder i.now { background: var(--gold); animation: bob 1s infinite; }
.next { font-size: 12px; color: var(--muted); margin-top: 3px; }
@keyframes bob { 50% { opacity: .5; } }
.stage.back { color: var(--red); animation: shake .5s; }
.stage.up { color: var(--green); animation: pop .6s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes pop { 50% { transform: scale(1.12); } }
/* 人：記得你上次怎麼對他 */
.people { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 8px; }
.pp { text-align: center; font-size: 10px; position: relative; }
.pp img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #f3e6d0; border: 3px solid #ddd; }
.pp.g img { border-color: var(--green); } .pp.r img { border-color: var(--red); }
.pp .mf { position: absolute; top: -2px; right: 10px; font-size: 15px; }
.pp .tg { display: block; min-height: 13px; color: #8a5a00; }
.pp.hit { animation: pop .6s; }
.when { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }
/* 卡片 */
.stagebox { position: relative; height: 300px; margin-top: 8px; }
.cardx { position: absolute; inset: 0 6px; background: #fff; border: 3px solid var(--room); border-radius: 22px; padding: 14px 14px; text-align: center; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 8px 0 rgba(0,0,0,.08); transition: transform .25s; display: flex; flex-direction: column; align-items: center; }
.cardx.drag { transition: none; }
.cardx.out { transition: transform .3s, opacity .3s; opacity: 0; }
.cardx img { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; background: #f3e6d0; pointer-events: none; }
.cardx .who { font-weight: 800; margin-top: 6px; font-size: 14px; }
.cardx .who small { font-weight: 400; color: var(--muted); }
.cardx .txt { font-size: 18px; line-height: 1.55; margin-top: 8px; flex: 1; display: flex; align-items: center; }
.cardx.ev { border-color: var(--red); }
.choice { position: absolute; top: 12px; max-width: 46%; padding: 6px 10px; border-radius: 12px; font-weight: 800; font-size: 14px; background: var(--room); color: #fff; opacity: 0; transition: opacity .1s; pointer-events: none; }
.choice.l { right: 10px; } .choice.r { left: 10px; }
.btns { display: flex; gap: 8px; margin-top: 12px; }
.btns button { flex: 1; border: 2px solid var(--room); background: #fff; border-radius: 14px; padding: 8px 6px; font-size: 14px; font-weight: 700; color: var(--ink); min-height: 64px; line-height: 1.35; }
.btns button small { display: block; font-size: 11px; font-weight: 400; color: #8a5a00; margin-top: 3px; }
.react { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); background: var(--room); color: #fff; border-radius: 16px; padding: 10px 14px; font-size: 15px; max-width: 88vw; z-index: 30; animation: rup .25s; display: flex; gap: 8px; align-items: center; }
.react img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
@keyframes rup { from { transform: translate(-50%, 16px); opacity: 0; } }
.toast { position: fixed; left: 50%; top: 6px; transform: translateX(-50%); padding: 9px 16px; border-radius: 12px; font-size: 16px; font-weight: 800; z-index: 31; animation: fade 1.8s forwards; pointer-events: none; color: #fff; }
.toast.up { background: var(--green); } .toast.back { background: var(--red); } .toast.mid { background: var(--room); }
@keyframes fade { 0%, 75% { opacity: 1; } 100% { opacity: 0; } }
/* 結局卡（要好截圖） */
.end { background: #fff; border: 3px solid var(--room); border-radius: 22px; padding: 16px 14px; margin-top: 10px; }
.end .big { font-size: 22px; font-weight: 800; margin: 4px 0; }
.line { display: flex; gap: 4px; align-items: center; justify-content: center; margin: 8px 0; font-size: 13px; }
.line b { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--room); background: #fff; display: inline-block; }
.line b.cut { border-style: dashed; border-color: #bbb; }
.line i { width: 22px; height: 4px; background: var(--room); display: inline-block; }
.line i.cut { background: repeating-linear-gradient(90deg, #bbb 0 4px, transparent 4px 8px); }
.credit { display: flex; height: 22px; border-radius: 11px; overflow: hidden; margin: 6px 0 2px; font-size: 11px; color: #fff; }
.credit div { display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; }
.rows div { font-size: 14px; padding: 5px 0; border-bottom: 1px dashed #eee; text-align: left; }
.post { text-align: left; background: #f6f3ee; border-radius: 12px; padding: 8px 10px; font-size: 14px; margin-top: 10px; }
.post b { font-size: 12px; color: #6b5a33; display: block; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// ==========================================================
// 一張支票（試玩切片）— 選上了，才發現推不動
// 要驗證的一件事：「推不動」好玩還是氣人。
// 摩卡與貓貓小隊
// ==========================================================
const $ = s => document.querySelector(s), app = $('#app');
const rnd = n => Math.floor(Math.random() * n), pick = a => a[rnd(a.length)];
const ART = '../fires/art/';
const TURNS = 16;
// 支票卡在哪一關（每關要推兩下）
const STAGES = ['已交辦', '研議中', '需跨局處協調', '地方說明會', '議會審預算', '請示中央', '動工'];
const NEED = 3;
// 四個人，各有盤算
const P = {
  dir: { n: '高局長', role: '交通局長・政務官', img: 'npc_foreign.webp', mind: '表面挺你，其實在看下一個位子' },
  chief: { n: '老陳', role: '捷運科科長・事務官', img: 'npc_staff.webp', mind: '在這裡待了 22 年，比你久' },
  coun: { n: '方議員', role: '選區議員', img: 'C_m_flat.webp', mind: '什麼都可以談' },
  li: { n: '阿雪姨', role: '機廠預定地的里長', img: 'C_f_flat.webp', mind: '她的里民會不會被吵' }
};
const METHOD = { press: '💪 施壓', credit: '🎖️ 給功勞', trade: '🤝 交換', concede: '✂️ 讓步', process: '⏳ 照程序', self: '🏃 自己來' };

// 時間：每一個決定是一季，四年 16 季
const when = () => { const n = Math.min(S.n, TURNS - 1), left = (TURNS - S.n) * 3; return `第 ${Math.floor(n / 4) + 1} 年・${'春夏秋冬'[n % 4]}　離選舉還有 ${left >= 12 ? Math.floor(left / 12) + ' 年' : ''}${left % 12 ? ' ' + left % 12 + ' 個月' : ''}`; };
let S;
function newGame() {
  S = { n: 0, stage: 0, push: 0, stations: 5, mood: { dir: 0, chief: 0, coun: 0, li: 0 }, credit: { dir: 0, coun: 0, li: 0, chief: 0 }, debt: { dir: 0, coun: 0, li: 0, chief: 0 },
    pressed: {}, seen: {}, last: null, log: [], debtAt: {}, visits: {} };
}
const moodOf = k => S.mood[k];
// ---------- 卡片 ----------
// 每個選項：t 文字、m 做法、push 推幾下、mood {人: ±}、credit [人, %]、debt 人、cut 砍站數、back 退一關、react [人, 一句話]
// 同一關第二次來：換一張（進度推了一點，但還沒過）
const ALT = {
  0: () => ({ who: 'dir', text: '時程表在跑了，各科室都在填表。',
    L: { t: '明天早上放我桌上', m: 'press', push: 2, mood: { dir: -1 }, react: ['dir', '（今晚全局加班）'] },
    R: { t: '缺人我調給你', m: 'process', push: 1, mood: { dir: 1 }, react: ['dir', '市長真體貼。'] } }),
  2: () => ({ who: 'chief', text: '都發局回函了：「原則同意，細節再議。」',
    L: { t: '細節我親自去議', m: 'self', push: 1, mood: { chief: 1 }, react: ['chief', '市長要親自去？……好。'] },
    R: { t: '讓局長去，功勞算他的', m: 'credit', push: 2, credit: ['dir', 10], mood: { dir: 1 }, react: ['dir', '細節就是我的專長。'] } }),
  3: () => ({ who: 'li', text: '說明會開完了，里民說要再開一場。',
    L: { t: '好，再開一場', m: 'process', push: 1, mood: { li: 1 }, react: ['li', '這才是尊重地方。'] },
    R: { t: '就這樣定案', m: 'press', push: 2, mood: { li: -1 }, react: ['li', '定案？我們還沒講完耶。'] } }),
  4: () => ({ who: 'coun', text: '預算委員會那邊，還差幾票喔。',
    L: { t: '你幫我拉票，下次挺你提案', m: 'trade', push: 2, debt: 'coun', mood: { coun: 1 }, react: ['coun', '成交。'] },
    R: { t: '按規矩表決', m: 'process', push: 1, react: ['coun', '那就看天意囉。'] } }),
  5: () => ({ who: 'dir', text: '中央說要再補一份財務計畫。',
    L: { t: '三天內補齊', m: 'press', push: 2, mood: { dir: -1, chief: -1 }, react: ['chief', '三天……（看了一眼局長）'] },
    R: { t: '你去中央說明，記者會你講', m: 'credit', push: 2, credit: ['dir', 15], mood: { dir: 1 }, react: ['dir', '我去，我去。'] } })
};
function stageCard() {
  const st = S.stage, m = S.mood, pr = S.pressed;
  const v = S.visits[st] || 0; S.visits[st] = v + 1;
  if (v % 2 === 1 && ALT[st]) return ALT[st]();
  switch (st) {
    case 0: return { who: 'dir', text: '市長放心，捷運延伸線我們局全力推動！', tag: 'dir0',
      L: { t: '下個月我要看到時程表', m: 'press', push: 2, mood: { dir: -1 }, react: ['dir', '……是，市長。（笑容僵了一秒）'] },
      R: { t: '交給你，記者會你來講', m: 'credit', push: 2, credit: ['dir', 20], mood: { dir: 1 }, react: ['dir', '謝謝市長！我馬上約記者。'] } };
    case 1: return S.seen.c1 ? { who: 'chief', text: pr.chief ? '上次市長要日期，我們排好了：後年第三季提報。' : '研議的部分還在研議，需要再研議。',
      L: { t: '明年第一季，不然換人', m: 'press', push: 2, mood: { chief: -1 }, react: ['chief', '（在筆記本上寫了什麼）'] },
      R: { t: '那中間能先做什麼？', m: 'process', push: 1, mood: { chief: 1 }, react: ['chief', '我回去研究看看。'] } }
      : { who: 'chief', text: '報告市長，這個案子……需要再研議。', tag: 'c1',
      L: { t: '研議多久？給我日期', m: 'press', push: 2, mood: { chief: -1 }, react: ['chief', '那就……「儘速」。'] },
      R: { t: '好，照程序來', m: 'process', push: 1, mood: { chief: 1 }, react: ['chief', '市長很明理。'] } };
    case 2: return m.dir <= -1 ? { who: 'dir', text: '跨局處協調啊……我最近比較忙。',
      L: { t: '我自己開會，今天就喬', m: 'self', push: 1, mood: { chief: -1 }, react: ['chief', '那每個局都要寫會議紀錄喔。'] },
      R: { t: '協調好了，記者會你站中間', m: 'credit', push: 2, credit: ['dir', 15], mood: { dir: 2 }, react: ['dir', '我突然有空了！'] } }
      : { who: 'chief', text: '都發局說要先改都市計畫，環保局說要先環評，文化局說路線下面可能有古蹟。',
      L: { t: '跨局處會議，今天就喬', m: 'press', push: 2, mood: { chief: -1, dir: -1 }, react: ['chief', '那……每個局都要寫會議紀錄。'] },
      R: { t: '讓局長去協調，他比較熟', m: 'credit', push: 2, credit: ['dir', 15], mood: { dir: 1 }, react: ['dir', '我來！這種事我最會。'] } };
    case 3: return m.li <= -1 ? { who: 'li', text: '上次的事我還記得。說明會，我帶五百人去。',
      L: { t: '親自到場被罵', m: 'self', push: 1, mood: { li: 1 }, react: ['li', '……至少你有來。'] },
      R: { t: '說明會改成線上辦', m: 'press', push: 2, mood: { li: -2 }, react: ['li', '好啊，你給我記住。'] } }
      : { who: 'li', text: '機廠要蓋在我們里？說明會我會帶三百人去。',
      L: { t: '捷運出口開在你們市場前', m: 'trade', push: 2, debt: 'li', mood: { li: 1 }, react: ['li', '這還差不多。你說的喔。'] },
      R: { t: '機廠移走，路線少一站', m: 'concede', push: 2, cut: 1, mood: { li: 1 }, react: ['li', '好啦。隔壁里的你自己去處理。'] } };
    case 4: return (S.debt.coun && S.log.includes('欠coun')) || m.coun <= -1 ? { who: 'coun', text: '上次答應的還沒做，捷運預算先凍結三成。',
      L: { t: '先做上次答應的', m: 'concede', push: 2, cut: 1, clear: 'coun', react: ['coun', '市長講信用，我就放行。'] },
      R: { t: '找議長出面喬', m: 'press', push: 2, mood: { coun: -2 }, react: ['coun', '找議長？好，我們走著瞧。'] } }
      : { who: 'coun', text: '捷運預算要過，我選區的活動中心也要排進去喔。',
      L: { t: '可以，一起排', m: 'trade', push: 2, debt: 'coun', mood: { coun: 1 }, react: ['coun', '市長爽快！'] },
      R: { t: '捷運是捷運，活動中心另案', m: 'process', push: 1, mood: { coun: -1 }, react: ['coun', '那我們就……慢慢審。'] } };
    case 5: return m.dir <= -1 ? { who: 'dir', text: '中央那邊……我覺得時機還沒到。',
      L: { t: '這是市長交辦的', m: 'press', push: 2, mood: { dir: -1 }, react: ['dir', '（回去就請了兩天假）'] },
      R: { t: '我親自去部會跑', m: 'self', push: 1, react: ['dir', '市長辛苦了。（鬆了一口氣）'] } }
      : { who: 'dir', text: '中央說要我們自籌四成，不然不核。',
      L: { t: '自籌就自籌，砍一站', m: 'concede', push: 2, cut: 1, react: ['dir', '那其他工程要排到後面了。'] },
      R: { t: '你跟次長熟，你去跑', m: 'credit', push: 2, credit: ['dir', 20], mood: { dir: 1 }, react: ['dir', '交給我。（順便約了次長吃飯）'] } };
    case 6: return { who: 'dir', text: '動工典禮，誰站中間？', final: 1,
      L: { t: '我。這是我的支票', m: 'self', push: 0, mood: { dir: -1, coun: -1 }, react: ['dir', '（站到了最邊邊）'] },
      R: { t: '局長和議員站中間', m: 'credit', push: 0, credit: ['dir', 10], credit2: ['coun', 10], mood: { dir: 1, coun: 1 }, react: ['coun', '這個鏡頭好！'] } };
  }
}
// 插進來的事：記得你上次怎麼對他
function eventCard() {
  const m = S.mood, d = S.debt, c = S.credit;
  const ev = [];
  if (d.coun && !S.seen.evCoun && S.n - S.debtAt.coun >= 3) ev.push({ tag: 'evCoun', who: 'coun', text: '活動中心呢？地方在問了。', ev: 1,
    L: { t: '挪捷運的錢先做', m: 'concede', cut: 1, clear: 'coun', react: ['coun', '市長講信用。'] },
    R: { t: '再等等', m: 'press', mood: { coun: -2 }, log: '欠coun', react: ['coun', '好，我記住了。'] } });
  if (d.li && !S.seen.evLi && S.n - S.debtAt.li >= 3) ev.push({ tag: 'evLi', who: 'li', text: '出口要開在市場前，你說的。設計圖呢？', ev: 1,
    L: { t: '改設計', m: 'concede', push: -1, clear: 'li', react: ['li', '這才像話。（設計重畫，進度退一格）'] },
    R: { t: '技術上做不到', m: 'press', mood: { li: -2 }, react: ['li', '技術上？選舉時你怎麼不說？'] } });
  if (c.dir >= 20 && !S.seen.evDir && S.n > 5) ev.push({ tag: 'evDir', who: 'dir', text: '市長，立委初選要到了，捷運的臉書可以讓我發嗎？', ev: 1,
    L: { t: '好，你發', m: 'credit', credit: ['dir', 15], mood: { dir: 1 }, react: ['dir', '「我一手推動的捷運」，按讚！'] },
    R: { t: '市府統一發', m: 'press', mood: { dir: -2 }, react: ['dir', '……了解。'] } });
  if (m.chief <= -2 && !S.seen.evChief) ev.push({ tag: 'evChief', who: 'chief', text: '依法行政，這份要再會辦交通部、都發局、環保局、文化局、主計處。', ev: 1,
    L: { t: '我親自打給每個局長', m: 'self', mood: { chief: -1 }, react: ['chief', '……市長好拚。'] },
    R: { t: '好吧，照規矩', m: 'process', back: 1, mood: { chief: 1 }, react: ['chief', '謝謝市長體諒。'] } });
  if (m.dir <= -2 && !S.seen.evDirSick) ev.push({ tag: 'evDirSick', who: 'dir', text: '局長請了一週病假，案子「暫緩辦理」。', ev: 1,
    L: { t: '打電話到他家', m: 'press', mood: { dir: -1 }, react: ['dir', '（咳咳）市長，我在休養……'] },
    R: { t: '等他回來', m: 'process', mood: { dir: 1 }, react: ['dir', '謝謝市長，我下週就回去。'] } });
  if (m.chief >= 2 && !S.seen.evChiefGood) ev.push({ tag: 'evChiefGood', who: 'chief', text: '市長，我加班把會辦單先跑完了。', ev: 1,
    L: { t: '謝謝老陳', m: 'process', push: 2, react: ['chief', '應該的。（第一次看到他笑）'] },
    R: { t: '請全科吃便當', m: 'process', push: 2, mood: { chief: 1 }, react: ['chief', '大家都說市長人不錯。'] } });
  if (m.coun >= 2 && !S.seen.evCounGood && S.stage < 4) ev.push({ tag: 'evCounGood', who: 'coun', text: '捷運預算，我幫你先跟其他議員打過招呼了。', ev: 1,
    L: { t: '謝了', m: 'process', mood: { coun: 0 }, debt: 'coun', react: ['coun', '以後再說。（他笑了）'] },
    R: { t: '我不想欠你', m: 'press', mood: { coun: -1 }, react: ['coun', '這麼見外？'] } });
  return ev.length && Math.random() < .7 ? pick(ev) : null;
}
function nextCard() {
  if (S.stage >= 6 && S.seen.final) return null;
  const e = S.last && !S.last.ev ? eventCard() : null;
  if (e) return e;
  return stageCard();
}

// ---------- 畫面 ----------
function face(k) { return ART + P[k].img; }
function tags(k) { const t = []; if (S.debt[k]) t.push('🤝欠'); if (S.mood[k] <= -2) t.push('😠記恨'); if (S.credit[k] >= 20) t.push('🎖️搶功'); if (S.mood[k] >= 2) t.push('💚挺你'); return t.join(' '); }
function topBar() {
  const st = S.stage;
  return `<div class="promise"><div class="t"><span>📜 競選支票：捷運延伸線 ${S.stations} 站</span><span>${when()}</span></div>
    <div class="stage" id="stg">${st >= 6 ? '🚧 動工' : '⏳ ' + STAGES[st]}<span class="pd">${st < 6 ? `這關推了 ${'●'.repeat(S.push)}${'○'.repeat(NEED - S.push)}` : ''}</span></div>
    <div class="ladder">${STAGES.map((x, i) => `<i class="${i < st ? 'ok' : i === st ? 'now' : ''}"></i>`).join('')}</div>
    <div class="next">${st < 6 ? `下一關：${STAGES[st + 1]}` : '只差典禮了'}</div></div>
    <div class="people">${Object.keys(P).map(k => `<div class="pp ${S.mood[k] >= 2 ? 'g' : S.mood[k] <= -2 ? 'r' : ''}" data-p="${k}"><img src="${face(k)}" alt=""><span class="mf">${S.mood[k] >= 1 ? '🙂' : S.mood[k] <= -1 ? '😒' : ''}</span><br>${P[k].n}<span class="tg">${tags(k)}</span></div>`).join('')}</div>`;
}
let CUR = null;
function render() {
  const c = CUR = nextCard();
  if (!c || S.n >= TURNS) return ending();
  if (c.tag) S.seen[c.tag] = 1;
  if (c.final) S.seen.final = 1;
  if (S.stage === 1) S.seen.c1 = S.seen.c1 || 0;
  const optB = o => `${o.t}<small>${METHOD[o.m]}${o.cut ? '・少一站' : ''}${o.credit ? '・功勞分給' + P[o.credit[0]].n : ''}${o.debt ? '・欠' + P[o.debt].n + '人情' : ''}${o.back ? '・退回上一關' : ''}</small>`;
  app.innerHTML = `${topBar()}
    <div class="stagebox"><div class="cardx ${c.ev ? 'ev' : ''}" id="card"><span class="choice r">${c.R.t}</span><span class="choice l">${c.L.t}</span>
      <img src="${face(c.who)}" alt=""><div class="who">${P[c.who].n} <small>${P[c.who].role}</small></div><div class="txt">${c.text}</div></div></div>
    <div class="btns"><button id="L">← ${optB(c.L)}</button><button id="R">${optB(c.R)} →</button></div>
    <div class="muted center" style="margin-top:6px">${S.n === 0 ? '往左或往右滑，或按按鈕。每種做法都有代價。' : '點上面的人，可以看他在想什麼'}</div>`;
  $('#L').onclick = () => choose('L'); $('#R').onclick = () => choose('R');
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => peek(b.dataset.p));
  drag($('#card'));
}
function peek(k) {
  const d = document.createElement('div'); d.className = 'react'; d.innerHTML = `<img src="${face(k)}" alt=""><span><b>${P[k].n}</b>：${P[k].mind}${S.mood[k] <= -2 ? '。他現在很不爽你。' : S.mood[k] >= 2 ? '。他現在挺你。' : ''}</span>`;
  document.body.appendChild(d); setTimeout(() => d.remove(), 1800);
}
function drag(el) {
  let x0 = null, dx = 0;
  const cl = el.querySelector('.choice.l'), cr = el.querySelector('.choice.r');
  el.onpointerdown = e => { x0 = e.clientX; dx = 0; el.classList.add('drag'); el.setPointerCapture(e.pointerId); };
  el.onpointermove = e => { if (x0 === null) return; dx = e.clientX - x0; el.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`; cr.style.opacity = dx > 25 ? 1 : 0; cl.style.opacity = dx < -25 ? 1 : 0; };
  el.onpointerup = el.onpointercancel = () => { if (x0 === null) return; x0 = null; el.classList.remove('drag'); if (dx > 90) return choose('R'); if (dx < -90) return choose('L'); el.style.transform = ''; cr.style.opacity = 0; cl.style.opacity = 0; };
}
let busy = false;
function choose(side) {
  if (busy || !CUR) return; busy = true;
  const c = CUR, o = c[side];
  const el = $('#card'); el.classList.add('out'); el.style.transform = `translateX(${side === 'L' ? -420 : 420}px) rotate(${side === 'L' ? -20 : 20}deg)`;
  S.n++; S.last = c;
  // 代價
  if (o.mood) for (const k in o.mood) S.mood[k] = Math.max(-3, Math.min(3, S.mood[k] + o.mood[k]));
  if (o.credit) S.credit[o.credit[0]] += o.credit[1];
  if (o.credit2) S.credit[o.credit2[0]] += o.credit2[1];
  if (o.debt) { S.debt[o.debt]++; S.debtAt[o.debt] = S.n; }
  if (o.clear) S.debt[o.clear] = 0;
  if (o.cut) S.stations = Math.max(2, S.stations - o.cut);
  if (o.log) S.log.push(o.log);
  if (o.m === 'press' && !c.ev) S.pressed[c.who] = 1;
  if (c.tag === 'dir0' && o.m === 'press') S.pressed.dir0 = 1;
  if (c.who === 'chief' && S.stage === 1) S.seen.c1 = 1;
  // 推進度：不開心的人會消極配合
  let push = o.push || 0, msg = null, cls = 'mid';
  const owner = c.who;
  if (push > 0 && S.mood[owner] <= -2 && !c.ev && Math.random() < .5) { push = Math.max(0, push - 1); msg = `${P[owner].n}消極配合中……`; }
  if (o.back && S.stage > 0) { S.stage--; S.push = 0; msg = `↩️ 退回：${STAGES[S.stage]}`; cls = 'back'; }
  else if (push < 0) { S.push = Math.max(0, S.push + push); msg = '↩️ 進度退了一格'; cls = 'back'; }
  else if (push > 0 && S.stage < 6) {
    S.push += push;
    if (S.push >= NEED) { S.stage++; S.push = 0; msg = S.stage >= 6 ? '🚧 可以動工了！' : `✅ ${STAGES[S.stage - 1]} → ${STAGES[S.stage]}`; cls = 'up'; }
    else if (!msg) msg = '還在' + STAGES[S.stage] + '……';
  } else if (!msg && S.stage < 6 && !c.final) msg = '還在' + STAGES[S.stage] + '……';
  // 公部門的日常：推了，但又「需要再研議」（不管你對誰好，偶爾就是會這樣）
  if (!c.ev && cls === 'mid' && push > 0 && S.stage >= 1 && S.stage < 6 && Math.random() < .2) { S.push = Math.max(0, S.push - 1); msg = pick(['📎 會辦單少蓋一個章，退回補件', '📎 承辦人請產假，案子交接中', '📎 主計處說預算科目不對', '📎 法制局說要再研議']); }
  // 事務官的日常：偶爾自己退一關（笑點）
  if (!c.ev && cls !== 'up' && S.stage >= 2 && S.stage < 6 && S.mood.chief <= -1 && Math.random() < .15) { S.stage--; S.push = 0; msg = `↩️ 公文被退回：${STAGES[S.stage]}`; cls = 'back'; }
  // 角色反應
  const [rk, rt] = o.react || [c.who, '……'];
  const r = document.createElement('div'); r.className = 'react'; r.innerHTML = `<img src="${face(rk)}" alt=""><span><b>${P[rk].n}</b>：${rt}</span>`; document.body.appendChild(r);
  if (msg) { const t = document.createElement('div'); t.className = 'toast ' + cls; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }
  setTimeout(() => { r.remove(); busy = false; if (c.final) return ending(); render(); const sg = $('#stg'); if (sg && cls !== 'mid') sg.classList.add(cls); Object.keys(o.mood || {}).forEach(k => { const x = document.querySelector(`[data-p="${k}"]`); if (x) x.classList.add('hit'); }); }, 1300);
}

// ---------- 結局卡 ----------
function ending() {
  CUR = null;
  const done = S.stage >= 6, others = S.credit.dir + S.credit.coun + S.credit.li + S.credit.chief;
  const you = Math.max(10, 100 - others), sc = (100 - you) / Math.max(1, others);
  const shares = [['你', you, '#2b2f36'], ['高局長', Math.round(S.credit.dir * sc), '#5b8bd9'], ['方議員', Math.round(S.credit.coun * sc), '#e0a526']].filter(x => x[1] > 0);
  const owe = Object.keys(S.debt).filter(k => S.debt[k]), hate = Object.keys(S.mood).filter(k => S.mood[k] <= -2), fans = Object.keys(S.mood).filter(k => S.mood[k] >= 2);
  let cm;
  if (!done && S.stage <= 2) cm = `四年過去了，捷運還在「${STAGES[S.stage]}」。`;
  else if (!done) cm = `捷運卡在「${STAGES[S.stage]}」，市長說：下一任一定動工。`;
  else if (you < 40) cm = '捷運動工了。問路人是誰做的，大家都說是局長。';
  else if (S.stations <= 3) cm = `捷運動工了，只是從 5 站變 ${S.stations} 站。`;
  else if (owe.length >= 2) cm = '捷運動工了，市長欠了一屁股人情。';
  else if (hate.length >= 2) cm = '動工典禮上，有兩個人沒有笑。';
  else cm = '說真的，這次支票有兌現。';
  const st = done ? '🚧 動工了！' : `⏳ 卡在「${STAGES[S.stage]}」`;
  const line = Array.from({ length: 5 }, (_, i) => `${i ? `<i class="${i >= S.stations ? 'cut' : ''}"></i>` : ''}<b class="${i >= S.stations ? 'cut' : ''}"></b>`).join('');
  app.innerHTML = `<div class="end center"><div class="muted">📜 競選支票：四年內，捷運延伸線動工</div><div class="big">${st}</div>
    <div class="line">${line}</div><div class="muted">${S.stations < 5 ? `原本答應 5 站，現在剩 ${S.stations} 站` : '5 站一站都沒少'}</div>
    <div style="margin-top:10px;font-size:13px;text-align:left">這條捷運，大家記得是誰做的：</div>
    <div class="credit">${shares.map(x => `<div style="width:${x[1]}%;background:${x[2]}">${x[1] >= 12 ? x[0] + ' ' + x[1] + '%' : ''}</div>`).join('')}</div>
    <div class="rows" style="margin-top:8px">
      <div>🤝 你欠誰：${owe.length ? owe.map(k => P[k].n).join('、') : '誰都不欠'}</div>
      <div>😠 誰記恨你：${hate.length ? hate.map(k => P[k].n).join('、') : '沒有人'}</div>
      <div>💚 誰挺你：${fans.length ? fans.map(k => P[k].n).join('、') : '沒有人特別挺你'}</div></div>
    <div class="post"><b>脆上的評語</b>${cm}</div>
    <div class="muted" style="margin-top:8px">《我推的市長》試玩切片・摩卡與貓貓小隊</div></div>
    <button class="btn" id="again">再推一次（換個做法）</button>`;
  $('#again').onclick = () => { newGame(); render(); };
}

// ---------- 開場 ----------
function title() {
  app.innerHTML = `<h1>📜 一張支票</h1><p class="center muted">《我推的市長》試玩切片・約 3 分鐘</p>
    <div class="card"><p><b>你選上市長了。</b></p><p>競選時你答應過：<b>「四年內，捷運延伸線動工。」</b></p><p>你以為當上市長，說一句就會動。</p></div>
    <div class="people" style="margin:14px 0">${Object.keys(P).map(k => `<div class="pp"><img src="${face(k)}" alt=""><br>${P[k].n}<br><span class="muted" style="font-size:10px">${P[k].role}</span></div>`).join('')}</div>
    <button class="btn" id="go">上任 →</button><p class="center muted">人物、城市全部虛構・摩卡與貓貓小隊</p>`;
  $('#go').onclick = () => { newGame(); render(); };
}
document.addEventListener('keydown', e => { if (!CUR) return; if (e.key === 'ArrowLeft') choose('L'); if (e.key === 'ArrowRight') choose('R'); });
title();
</script>
</body>
</html>

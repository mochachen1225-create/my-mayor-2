<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>修城市（試玩版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
/* 配色、字型延續選戰篇 */
:root { --paper: #faf8f5; --ink: #2a2a2a; --muted: #7a7a7a; --room: #2b2f36; --red: #d93636; --gold: #e0a526; --green: #2e9e6a; --line: #e4e0da; --road: #d9d4cb; --blue: #5b8bd9; }
@font-face { font-family: 'ColorEmoji'; src: local('Apple Color Emoji'), local('Segoe UI Emoji'), local('Noto Color Emoji'); unicode-range: U+1F000-1FAFF, U+2600-27BF, U+2B00-2BFF, U+FE0F; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: #1d2026; color: var(--ink); font-family: 'ColorEmoji', 'Huninn', 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; overscroll-behavior: none; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--paper); padding: 8px 12px 16px; position: relative; overflow: hidden; }
button { font-family: inherit; cursor: pointer; }
h1 { text-align: center; margin: 24px 0 4px; font-size: 30px; }
h2 { margin: 6px 0; font-size: 20px; }
.muted { color: var(--muted); font-size: 13px; }
.center { text-align: center; }
.btn { display: block; width: 100%; border: 0; border-radius: 999px; padding: 14px; margin: 10px 0; font-size: 17px; font-weight: 700; background: var(--room); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--room); }
.card { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 12px; margin: 10px 0; }
/* 指標：太高太低都會出事 */
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.st { text-align: center; font-size: 11px; position: relative; padding-top: 8px; }
.st .ic { font-size: 22px; line-height: 1; }
.st i { display: block; height: 8px; border-radius: 4px; background: #eee; overflow: hidden; margin: 3px 4px 0; position: relative; }
.st i b { display: block; height: 100%; transition: width .4s; }
.st i::before, .st i::after { content: ''; position: absolute; top: 0; bottom: 0; width: 15%; background: rgba(217,54,54,.13); z-index: 1; }
.st i::before { left: 0; } .st i::after { right: 0; }
.st.k i::before { display: none; }
.st .pv { position: absolute; top: 0; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--room); opacity: 0; transition: opacity .15s; }
.st.on .pv { opacity: 1; }
.st.flash { animation: fl .6s; }
@keyframes fl { 50% { transform: scale(1.25); } }
.when { display: flex; align-items: center; gap: 8px; margin: 6px 0 4px; font-size: 13px; }
.when b { font-size: 15px; }
.when .sp { flex: 1; }
.tag { border: 0; background: #f0ece6; border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--ink); }
/* 小地圖：N 城六區，答應的事會變漂亮，沒處理的越來越破 */
.mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--road); border-radius: 12px; padding: 4px; }
.mini > div { border-radius: 8px; padding: 2px 4px 3px; font-size: 10px; transition: filter .6s; }
.mini span { font-size: 17px; display: inline-block; position: relative; }
.mini span.broken { filter: grayscale(1) opacity(.55); }
.mini span.rot { filter: grayscale(1) brightness(.6); }
.mini span.work::after { content: '🏗️'; position: absolute; right: -5px; bottom: -3px; font-size: 9px; }
.mini span.fixed { animation: pop .8s; }
@keyframes pop { 50% { transform: scale(1.6); } }
/* 卡片 */
.stage { position: relative; height: 380px; margin-top: 10px; }
.cardx { position: absolute; inset: 0 8px; background: #fff; border: 3px solid var(--room); border-radius: 22px; padding: 16px 14px; text-align: center; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 8px 0 rgba(0,0,0,.08); transition: transform .25s; display: flex; flex-direction: column; align-items: center; }
.cardx.drag { transition: none; }
.cardx.out { transition: transform .3s, opacity .3s; opacity: 0; }
.cardx.tut { border-color: var(--gold); }
.cardx img { width: 132px; height: 132px; border-radius: 50%; object-fit: cover; background: #f3e6d0; pointer-events: none; }
.cardx .who { font-weight: 800; margin-top: 6px; font-size: 15px; }
.cardx .txt { font-size: 18px; line-height: 1.55; margin-top: 10px; flex: 1; display: flex; align-items: center; }
.cardx .big { font-size: 96px; line-height: 132px; height: 132px; }
.choice { position: absolute; top: 12px; max-width: 46%; padding: 6px 10px; border-radius: 12px; font-weight: 800; font-size: 15px; background: var(--room); color: #fff; opacity: 0; transition: opacity .1s; pointer-events: none; }
.choice.l { right: 10px; } .choice.r { left: 10px; }
.timer { height: 6px; background: #eee; border-radius: 3px; overflow: hidden; width: 100%; margin-top: 6px; }
.timer b { display: block; height: 100%; background: var(--red); width: 100%; }
.under { position: absolute; inset: 10px 18px -6px; background: #ece7df; border-radius: 22px; z-index: -1; }
.btns { display: flex; gap: 8px; margin-top: 14px; }
.btns button { flex: 1; border: 2px solid var(--room); background: #fff; border-radius: 14px; padding: 10px 6px; font-size: 14px; font-weight: 700; color: var(--ink); min-height: 52px; }
.btns button:disabled { opacity: .3; }
.btns button.gray { border-style: dashed; }
.btns button.hl { background: var(--gold); border-color: var(--gold); }
.hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 6px; }
/* 彈出 */
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; }
.sheet .box { background: var(--paper); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 14px 14px calc(18px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto; animation: up .25s; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.goal { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
.toast { position: fixed; left: 50%; top: 110px; transform: translateX(-50%); background: var(--room); color: #fff; padding: 9px 14px; border-radius: 12px; font-size: 14px; z-index: 30; max-width: 92vw; animation: fade 2.6s forwards; pointer-events: none; text-align: center; }
@keyframes fade { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
/* 小遊戲 */
.mg { text-align: center; }
.doc { background: #fffdf7; border: 2px solid #d8cfbf; border-radius: 12px; padding: 14px; font-size: 16px; margin: 10px 0; min-height: 96px; text-align: left; line-height: 1.6; }
.doc small { color: var(--muted); display: block; }
.mgb { display: flex; gap: 10px; }
.mgb button { flex: 1; border: 0; border-radius: 14px; padding: 16px; font-size: 18px; font-weight: 800; color: #fff; }
.field { position: relative; height: 330px; background: #2b2f36; border-radius: 16px; margin: 10px 0; overflow: hidden; }
.q { position: absolute; border: 0; border-radius: 14px; padding: 8px 10px; font-size: 13px; max-width: 62%; animation: up .2s; }
.q.bad { background: #ffd7d7; } .q.ok { background: #d9ecff; }
.ending { text-align: center; }
.ending .bigE { font-size: 72px; }
.gal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.gal div { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 8px 4px; font-size: 12px; text-align: center; }
.gal div.no { opacity: .35; }
.gal b { display: block; font-size: 26px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// ==========================================================
// 修城市（試玩版 0.3）— 左右滑做決定的市長遊戲
// 卡片一直來：一個人、一句話、往左或往右。太高太低都會出事。
// 摩卡與貓貓小隊
// ==========================================================
const $ = s => document.querySelector(s), app = $('#app');
const rnd = n => Math.floor(Math.random() * n), pick = a => a[rnd(a.length)], shuffle = a => a.slice().sort(() => Math.random() - .5);
const TERM = 96; // 一任四年：每兩張卡過一個月
const STATS = { p: ['😊', '民意'], c: ['🏛️', '議會'], m: ['💰', '財政'], y: ['🏙️', '城市'], k: ['🤫', '口袋'] };
const SAVE = 'cityswipe.v1';
let SV = (() => { try { return JSON.parse(localStorage.getItem(SAVE)) || {}; } catch (e) { return {}; } })();
SV.unlock = SV.unlock || []; SV.ends = SV.ends || []; SV.titles = SV.titles || []; SV.terms = SV.terms || 0;
const save = () => { try { localStorage.setItem(SAVE, JSON.stringify(SV)); } catch (e) {} };

// ---------- 人物（選戰篇的畫風；不出現你的家人）----------
const CH = {
  sec: ['秘書小芸', 'npc_intern'], yuki: ['阿雪姨・舊城區里長', 'npc_elder'], fang: ['方議員', 'C_m'], he: ['何議員', 'E_f'], gao: ['高議員', 'D_m'],
  zhou: ['周副市長', 'npc_councilor'], lin: ['林副市長', 'npc_director'], work: ['工務局長', 'npc_staff'], traffic: ['交通局長', 'npc_foreign'],
  reporter: ['記者小葉', 'npc_reporter'], boss: ['廠商王董', 'npc_shady'], party: ['黨部主委', 'npc_donor'], fin: ['主計處長', 'B_f'],
  ethic: ['政風處長', 'npc_chief'], vol: ['志工阿傑', 'npc_volunteer'], pundit: ['政論名嘴', 'npc_pundit'],
  c1: ['早餐店阿姨', 'F_f'], c2: ['外送員小陳', 'F_m'], c3: ['市場攤商', 'B_m'], c4: ['三寶媽', 'C_f'], c5: ['退休老師', 'E_m'], c6: ['店家老闆', 'D_f'],
  // 解鎖角色
  kai: ['捷運通勤族阿凱', 'F_m'], weather: ['氣象主播', 'F_f'], grand: ['阿雪姨的孫女（網紅）', 'C_f'], tourist: ['外國背包客', 'E_m'], agent: ['天王經紀人', 'D_f'], ethic2: ['政風處長', 'npc_chief']
};
const imgOf = (who, mood) => { const i = CH[who][1]; return i.startsWith('npc') ? `art/${i}.webp` : `art/${i}_${mood || 'flat'}.webp`; };

// ---------- N 城地圖（沿用 0.2）----------
const DIST = [{ id: 'old', n: '舊城區', c: '#f4d9b8' }, { id: 'river', n: '河濱區', c: '#cfe4f2' }, { id: 'tech', n: '科技園區', c: '#dcd6f2' }, { id: 'east', n: '東區商圈', c: '#f6d3d9' }, { id: 'hill', n: '山邊住宅區', c: '#d6ecd2' }, { id: 'port', n: '港灣區', c: '#d2ecec' }];
const SITES = {
  park: ['old', '🗑️', '🌳', '共融公園'], market: ['old', '🏚️', '🥬', '新市場'], pole: ['old', '🪵', '🚶', '暢通的人行道'],
  bike: ['river', '🚧', '🚲', '河濱自行車道'], sky: ['river', '🌁', '🌉', '夜間步道'], lamp: ['river', '💡', '🌟', '新路燈'],
  metro: ['tech', '🚇', '🚄', '捷運延伸線'], land: ['tech', '📜', '🏢', '大廠進駐'],
  dome: ['east', '🏗️', '🏟️', '巨型場館'], cross: ['east', '🚦', '🛣️', '順暢的路口'], scooter: ['east', '🛵', '🚸', '走得過的騎樓'],
  housing: ['hill', '🏚️', '🏘️', '社會住宅'], elder: ['hill', '🧓', '🏡', '長照據點'], lunch: ['hill', '🍱', '🍎', '熱騰騰的營養午餐'],
  stadium: ['port', '🏟️', '🏆', '不積水的體育場'], museum: ['port', '🏛️', '🎨', '青年基地']
};

// ---------- 卡片 ----------
// L/R：[選項, 效果]。效果：p c m y k 數值；f 設旗標；fix [地方, 幾張卡後完工]；q [卡片, 幾張卡後回來]；fn 自訂
// o.once 預設一次；o.rep 可重複（冷卻張數）；o.cond 出現條件；o.set 解鎖組
const CARDS = {};
const C = (id, who, text, L, R, o = {}) => { CARDS[id] = { id, who, text, L, R, ...o }; };
const has = f => S.f[f];

// 教學
C('t1', 'sec', '市長早！往右滑＝答應。先把就職典禮的花籃收下吧。', ['（往右滑）', {}], ['收下', { p: 2 }], { tut: 'R' });
C('t2', 'sec', '往左滑＝拒絕。廠商送來一盒月餅，盒底好像有東西……', ['退回去', { p: 3 }], ['（往左滑）', {}], { tut: 'L' });
C('t3', 'sec', '拖著卡片先不要放，上面會亮起「會動到」的指標。太高太低都會出事喔！', ['我知道了', { c: 1 }], ['我知道了', { p: 1 }], { tut: 'any' });

// 阿雪姨的公園（故事線）
C('a1', 'yuki', '市長，公園髒到狗都不想去，你什麼時候來看？', ['下個月排行程', { p: -4, q: ['a2b', 7] }], ['明天就去', { p: 3, m: -5, fix: ['park', 6], q: ['a2', 9] }]);
C('a2', 'yuki', '公園整理好了，阿嬤們每天去跳舞，謝謝你啦！', ['是大家的功勞', { p: 4, f: 'yukiHappy' }], ['辦個啟用典禮', { p: 6, m: -3, f: 'yukiHappy' }], { mood: 'smile' });
C('a2b', 'yuki', '上次說下個月，我帶了三百個連署來了。', ['再等等', { p: -8, q: ['a3b', 7] }], ['好，馬上整理', { p: 2, m: -6, fix: ['park', 5], q: ['a2', 8] }]);
C('a3b', 'yuki', '我去找記者了，你自己看著辦。', ['隨便她', { p: -10, c: -3 }], ['親自登門道歉', { p: 6, fix: ['park', 6], q: ['a2', 9] }]);
// 方議員（同一位議員，這次幫你、下次擋你）
C('b1', 'fang', '河濱步道那個標案，我朋友的公司很優，給他做嘛。', ['照規矩投標', { c: -8, q: ['b2no', 8], fix: ['sky', 10] }], ['我看看', { c: 10, k: 12, f: 'fangDeal', fix: ['sky', 7], q: ['b2yes', 6] }], { gray: 'R' });
C('b2no', 'fang', '你的追加預算，我們這一席很難支持喔。', ['那就不追加', { y: -4, m: 3 }], ['好啦，下次給你朋友', { c: 12, k: 8 }], { gray: 'R' });
C('b2yes', 'boss', '市長，步道快做好了，一點心意。', ['退回去', { k: -6, c: -4 }], ['收下', { k: 18 }], { gray: 'R' });
C('b3', 'reporter', '河濱步道才啟用三個月就龜裂，聽說廠商跟方議員很熟？', ['無可奉告', { p: -10, k: 6 }], ['我會徹查', { p: 5, c: -15 }], { cond: () => has('fangDeal') && S.site.sky === 'fixed' });
C('b4', 'fang', '上次你沒給我朋友做，但這次的預算……我還是會幫你。', ['謝謝議員', { c: 6 }], ['你想要什麼？', { c: -3, p: 2 }], { cond: () => S.n > 40 && !has('fangDeal') });
// 捷運（目標）
C('m1', 'traffic', '捷運延伸線卡在中央核定，要不要你親自去跑？', ['讓局處去跑', { q: ['m2', 10] }], ['我親自去', { p: 3, m: -3, q: ['m2', 5] }]);
C('m2', 'traffic', '核定了！但施工要封兩個車道，附近店家會哭。', ['晚點再開工', { y: -3, q: ['m2', 9] }], ['開工！', { p: -7, m: -12, f: 'metroWork', q: ['m3', 6], work: 'metro' }]);
C('m3', 'c6', '施工圍籬擋住店門口，我生意掉一半！', ['忍一下，通車就好', { p: -6, q: ['m4', 8] }], ['發施工補償金', { m: -8, p: 4, q: ['m4', 8] }], { mood: 'sad' });
C('m4', 'traffic', '捷運快好了！要不要趕在選前辦通車典禮？', ['等安全測試跑完', { q: ['m5good', 5] }], ['選前通車！', { p: 9, q: ['m5bad', 4], fix: ['metro', 0], f: 'metroDone' }]);
C('m5good', 'traffic', '測試跑完，如期通車，月台擠爆了！', ['搭第一班車', { p: 8, fix: ['metro', 0], f: 'metroDone' }], ['發新聞稿就好', { p: 4, fix: ['metro', 0], f: 'metroDone' }], { mood: 'smile' });
C('m5bad', 'reporter', '通車第三天停駛兩小時，乘客被關在車廂裡。', ['怪包商', { p: -6, c: -4 }], ['市長公開道歉', { p: -2 }]);
C('m6', 'c5', '捷運站附近房價漲三成，年輕人搬走了。', ['市場機制', { y: 6, p: -5 }], ['在站旁蓋社宅', { m: -10, y: -3, p: 5 }], { cond: () => has('metroDone') });
// 周副市長
C('z1', 'zhou', '市長，剪綵我去就好，你那麼忙。', ['我自己去', { p: 3, c: -2 }], ['麻煩你了', { p: -3, q: ['z2', 12] }]);
C('z2', 'zhou', '鄰市黨部找我去選市長，我想辭職。', ['留下來幫我', { c: 4, m: -3 }], ['祝你順利', { c: -5, p: 2 }]);
// 記者小葉
C('r1', 'reporter', '有人說你上任後都沒去過山邊住宅區？', ['行程很滿', { p: -5 }], ['這週就去', { p: 4, m: -4, fix: ['elder', 7] }]);
C('r2', 'reporter', '1999 結案率 98%，可是我打過去都說「已列管」。', ['數字不會騙人', { p: -6 }], ['改成看滿意度', { p: 5, c: -3 }]);
C('r3', 'reporter', '市長，口袋裡的東西，要不要先跟我說？', ['沒什麼好說', { p: -6 }], ['……', { p: -2 }], { cond: () => S.s.k >= 50 });
// 廠商（灰色誘惑）
C('v1', 'boss', '路燈十年合約我們可以續約，條件好談。', ['重新招標', { m: -6, fix: ['lamp', 6] }], ['續約', { k: 18, y: -4 }], { gray: 'R' });
C('v2', 'boss', '我們董事長想請市長吃個飯，就吃個飯。', ['不了', { c: -2 }], ['好啊', { k: 10, c: 4 }], { gray: 'R' });
C('v3', 'boss', '營養午餐又流標，我們可以「協助」，價格好說。', ['提高預算重招', { m: -7, fix: ['lunch', 5] }], ['交給你們', { k: 14, fix: ['lunch', 3], p: -3 }], { gray: 'R' });
// 黨部
C('pa1', 'party', '黨部推薦一位前輩當局長，很有經驗。', ['我自己找', { c: -8 }], ['好', { c: 8, y: -4 }]);
C('pa2', 'party', '選前要多剪綵，工程趕一下。', ['照進度', { c: -6 }], ['趕！', { p: 6, y: -6 }], { cond: () => S.n > 50 });
C('pa3', 'party', '方議員連任很危險，他選區的建設多排一點。', ['各區一視同仁', { c: -6 }], ['照辦', { c: 10, m: -6, p: -2 }]);
// 林副市長（很會推責任）
C('l1', 'lin', '營養午餐流標了，我覺得是中央的問題。', ['先怪中央', { p: -4, c: 3 }], ['提高預算重招', { m: -6, p: 5, fix: ['lunch', 5] }]);
C('l2', 'lin', '紀念館的事，我想是前任的問題。', ['那就讓它放著', { y: -3 }], ['改成青年基地', { m: -6, p: 3, fix: ['museum', 6] }]);

// ---------- 狀態 ----------
let S;
function newGame(tut) {
  S = { n: 0, s: { p: 50, c: 50, m: 50, y: 30, k: 0 }, f: {}, used: {}, q: [], site: {}, fixQ: [], tut: tut ? 1 : 0, mg: 0, recent: [],
    goals: shuffle(Object.keys(GOALS)).slice(0, 3), term: SV.terms + 1, face: `art/A_${rnd(2) ? 'm' : 'f'}_` };
  for (const k in SITES) S.site[k] = 'broken';
  next();
}
const month = () => Math.floor(S.n / 2) % 12 + 1, year = () => Math.floor(S.n / 24) + 1;
const pushQ = (id, d) => S.q.push({ id, at: S.n + d });
function pickCard() {
  if (S.tut) return CARDS['t' + S.tut];
  const due = S.q.findIndex(x => x.at <= S.n);
  if (due >= 0) return CARDS[S.q.splice(due, 1)[0].id];
  // 季節卡：每月第一張
  if (S.n % 2 === 0) { const sc = Object.values(CARDS).find(c => c.season === month() && (!c.year || c.year === year()) && !S.used[c.id + ':' + year()]); if (sc) { S.used[sc.id + ':' + year()] = 1; return sc; } }
  // 打斷節奏：小遊戲
  if (S.n - S.mg >= 13 && S.n > 6) { S.mg = S.n; return { mini: (S.mgk = (S.mgk || 0) + 1) % 2 ? 'stamp' : 'mic' }; }
  const pool = Object.values(CARDS).filter(c => !c.tut && !c.season && !/^(a2|a2b|a3b|b2no|b2yes|m2|m3|m4|m5good|m5bad|z2|w3b|tyHit|tySun|tyOk)$/.test(c.id)
    && (!c.set || SV.unlock.includes(c.set)) && (!c.cond || c.cond())
    && (c.rep ? !(S.used[c.id] && S.n - S.used[c.id] < c.rep) : !S.used[c.id]) && !S.recent.includes(c.id)
    && !S.q.some(x => x.id === c.id));
  return pick(pool.length ? pool : [CARDS.q1, CARDS.q3, CARDS.q9]);
}
function apply(e) {
  if (!e) return;
  const ch = {};
  for (const k in STATS) if (e[k]) { S.s[k] += e[k]; ch[k] = 1; }
  if (e.f) S.f[e.f] = 1;
  if (e.work) S.site[e.work] = 'work';
  if (e.fix) { const [id, d] = e.fix; if (S.site[id] !== 'fixed') { if (d === 0) fixNow(id); else { S.site[id] = 'work'; S.fixQ.push({ id, at: S.n + d }); } } }
  if (e.q) pushQ(e.q[0], e.q[1]);
  if (e.fn) e.fn();
  return ch;
}
function fixNow(id) {
  if (S.site[id] === 'fixed') return;
  S.site[id] = 'fixed'; S.s.y += 6; S.justFixed = id;
  flash(`✨ ${SITES[id][3]}完工了！${DIST.find(d => d.id === SITES[id][0]).n}變漂亮了`);
}
// 時間往前走：工程完工、沒處理的地方越來越破
function tick() {
  S.n++;
  if (S.n % 2 === 0) S.s.m += 2; // 每個月的稅收
  S.fixQ = S.fixQ.filter(x => { if (x.at <= S.n) { fixNow(x.id); return false; } return true; });
  if (S.n % 14 === 0) {
    const b = Object.keys(S.site).filter(k => S.site[k] === 'broken');
    if (b.length) { const id = pick(b); S.site[id] = 'rot'; S.s.y -= 4; S.s.p -= 2; flash(`💢 ${SITES[id][1]} ${DIST.find(d => d.id === SITES[id][0]).n}有個地方越來越破，里長在臉書開罵`); }
  }
  for (const k in S.s) S.s[k] = Math.max(0, Math.min(100, S.s[k]));
}
function checkEnd() {
  const s = S.s;
  for (const k of ['p', 'c', 'm', 'y']) { if (s[k] <= 0) return k + '0'; if (s[k] >= 100) return k + '100'; }
  if (s.k >= 100) return 'k100';
  if (S.n >= TERM) return s.p >= 50 && s.c >= 30 ? 'win' : 'lose';
  return null;
}

// ---------- 畫面 ----------
function statsHtml() {
  return `<div class="stats">${Object.keys(STATS).map(k => { const v = S.s[k], danger = k === 'k' ? v >= 70 : (v <= 15 || v >= 85); return `<div class="st ${k}" data-st="${k}"><b class="pv"></b><div class="ic">${STATS[k][0]}</div><i><b style="width:${v}%;background:${danger ? 'var(--red)' : k === 'k' ? '#9a7bd1' : k === 'y' ? 'var(--blue)' : 'var(--green)'}"></b></i>${STATS[k][1]}</div>`; }).join('')}</div>`;
}
function miniHtml() {
  return `<div class="mini">${DIST.map(d => { const ks = Object.keys(SITES).filter(k => SITES[k][0] === d.id), ok = ks.filter(k => S.site[k] === 'fixed').length / ks.length;
    return `<div style="background:${d.c};filter:saturate(${.3 + ok * .9})">${d.n}<br>${ks.map(k => `<span class="${S.site[k] === 'fixed' ? 'ok' : S.site[k]}${S.justFixed === k ? ' fixed' : ''}">${S.site[k] === 'fixed' ? SITES[k][2] : SITES[k][1]}</span>`).join('')}</div>`; }).join('')}</div>`;
}
let CUR = null, timerId = null;
function next() {
  const end = checkEnd(); if (end) return ending(end);
  const c = pickCard(); CUR = c;
  if (c.mini) return c.mini === 'stamp' ? stampGame() : micGame();
  if (!c.tut && !c.season) { S.used[c.id] = S.n || 1; S.recent = [c.id].concat(S.recent).slice(0, 6); }
  render();
}
function render() {
  const c = CUR, gray = c.gray;
  const pic = c.who ? `<img src="${imgOf(c.who, c.mood)}" alt="">` : '';
  app.innerHTML = `${statsHtml()}
    <div class="when"><img src="${S.face}smile.webp" style="width:28px;height:28px;border-radius:50%" alt=""><b>第 ${year()} 年 ${month()} 月</b><span class="muted">第 ${S.term} 任市長</span><span class="sp"></span><button class="tag" id="goalsB">🎯 目標 ${S.goals.filter(g => GOALS[g][2]()).length}/3</button></div>
    ${miniHtml()}
    <div class="stage"><div class="under"></div><div class="cardx ${c.tut ? 'tut' : ''}" id="card">
      <span class="choice r" id="cr">${c.R[0]}</span><span class="choice l" id="cl">${c.L[0]}</span>
      ${pic}<div class="who">${CH[c.who][0]}</div><div class="txt">${c.text}</div>
      ${c.timer ? '<div class="timer"><b id="tb"></b></div>' : ''}</div></div>
    <div class="btns"><button id="L" ${c.tut === 'R' ? 'disabled' : ''} class="${gray === 'L' ? 'gray' : ''}">← ${c.L[0]}</button><button id="R" ${c.tut === 'L' ? 'disabled' : ''} class="${gray === 'R' ? 'gray' : ''}">${c.R[0]} →</button></div>
    <div class="hint">${c.tut === 'R' ? '👉 把卡片往右滑（或按右邊的按鈕）' : c.tut === 'L' ? '👈 把卡片往左滑' : c.tut ? '拖著卡片先不要放，看看上面哪個指標亮起來' : '往左或往右滑。拖著不放，可以看會動到哪些指標'}</div>`;
  S.justFixed = null;
  $('#goalsB').onclick = () => showGoals();
  $('#L').onclick = () => choose('L'); $('#R').onclick = () => choose('R');
  drag($('#card'));
  if (c.timer) {
    const t0 = Date.now(), T = c.timer * 1000;
    clearInterval(timerId);
    timerId = setInterval(() => { const left = 1 - (Date.now() - t0) / T; const tb = $('#tb'); if (!tb || CUR !== c) return clearInterval(timerId); tb.style.width = Math.max(0, left * 100) + '%'; if (left <= 0) { clearInterval(timerId); choose('T'); } }, 100);
  }
}
function preview(side) {
  document.querySelectorAll('.st').forEach(x => x.classList.remove('on'));
  if (!side) return;
  const e = CUR[side][1];
  for (const k in STATS) if (e[k]) document.querySelector(`.st.${k}`).classList.add('on');
  if (e.fix && !e.y) document.querySelector('.st.y').classList.add('on');
  if (e.fn) Object.keys(STATS).filter(k => k === 'p').forEach(k => document.querySelector(`.st.${k}`).classList.add('on'));
}
function drag(el) {
  let x0 = null, dx = 0;
  const cl = $('#cl'), cr = $('#cr');
  el.onpointerdown = e => { x0 = e.clientX; dx = 0; el.classList.add('drag'); el.setPointerCapture(e.pointerId); };
  el.onpointermove = e => {
    if (x0 === null) return; dx = e.clientX - x0;
    if (CUR.tut === 'R' && dx < 0) dx /= 4; if (CUR.tut === 'L' && dx > 0) dx /= 4;
    el.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    const side = dx > 25 ? 'R' : dx < -25 ? 'L' : null;
    cr.style.opacity = side === 'R' ? 1 : 0; cl.style.opacity = side === 'L' ? 1 : 0;
    preview(side);
  };
  el.onpointerup = el.onpointercancel = () => {
    if (x0 === null) return; x0 = null; el.classList.remove('drag');
    if (dx > 90 && CUR.tut !== 'L') return choose('R');
    if (dx < -90 && CUR.tut !== 'R') return choose('L');
    el.style.transform = ''; cr.style.opacity = 0; cl.style.opacity = 0; preview(null);
  };
}
function choose(side) {
  const c = CUR; if (!c || c.done) return; c.done = 1; clearInterval(timerId);
  const el = $('#card'); if (el) { el.classList.add('out'); el.style.transform = `translateX(${side === 'L' ? -420 : 420}px) rotate(${side === 'L' ? -20 : 20}deg)`; }
  const e = side === 'T' ? c.timeout : c[side][1];
  const ch = apply(e) || {};
  if (/^q\d/.test(c.id) && side === 'R') S.f.cit = (S.f.cit || 0) + 1;
  if (c.tut) { S.tut = c.tut === 'any' ? 0 : S.tut + 1; }
  setTimeout(() => { delete c.done; if (c.tut === 'any') { tick(); showGoals(true); return; } if (!c.tut) tick(); next(); Object.keys(ch).forEach(k => { const x = document.querySelector(`.st.${k}`); if (x) x.classList.add('flash'); }); }, 260);
}
function flash(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
function sheet(html, after) { const d = document.createElement('div'); d.className = 'sheet'; d.innerHTML = `<div class="box">${html}</div>`; document.body.appendChild(d); after && after(d); return d; }
function showGoals(first) {
  sheet(`<h2>🎯 這一任的三個目標</h2>${first ? '<div class="muted">達成會解鎖新角色，下一任市長就看得到。</div>' : ''}
    ${S.goals.map(g => `<div class="goal"><span style="font-size:22px">${GOALS[g][2]() ? '✅' : GOALS[g][0]}</span><span>${GOALS[g][1]}<br><small class="muted">解鎖：${SV.unlock.includes(g) ? '已解鎖 ' : ''}${GOALS[g][3]}</small></span></div>`).join('')}
    <div class="muted" style="margin-top:8px">指標太高、太低都會出事。口袋滿了一定會被查。</div>
    <button class="btn" id="x">${first ? '開始上任 →' : '繼續'}</button>`, d => d.querySelector('#x').onclick = () => { d.remove(); if (first) next(); });
}

// ---------- 小遊戲（10 秒左右）----------
const DOCS = [['路燈維修經費 12 萬', 1], ['里民活動中心冷氣汰換', 1], ['颱風前清淤急件', 1], ['公園植栽採購，附估價單三份', 1], ['人行道改善工程，金額 3,000,000,0 元', 0, '金額多了一個 0'],
  ['議員辦公室「建議」得標廠商名單', 0, '關說條子'], ['招標文件（附件：無）', 0, '附件不見了'], ['市長出國考察，行程：購物三天', 0, '這不是考察'], ['同一筆款項，第二次請款', 0, '重複請款'], ['學校營養午餐食材驗收', 1]];
function stampGame() {
  const docs = shuffle(DOCS).slice(0, 5); let i = 0, ok = 0, bad = [];
  const t0 = Date.now(), T = 12000;
  const draw = () => {
    if (i >= docs.length || Date.now() - t0 > T) return done();
    app.innerHTML = `${statsHtml()}<div class="mg"><h2>📑 公文快速批</h2><div class="muted">12 秒內批完 5 份。有問題的要退回！（${i + 1}/5）</div><div class="timer"><b id="tb"></b></div>
      <div class="doc"><small>簽呈・${['工務局', '交通局', '社會局', '秘書處', '主計處'][i]}</small>${docs[i][0]}</div>
      <div class="mgb"><button style="background:var(--red)" id="no">退回</button><button style="background:var(--green)" id="yes">核可</button></div></div>`;
    $('#yes').onclick = () => { if (docs[i][1]) ok++; else bad.push(docs[i]); i++; draw(); };
    $('#no').onclick = () => { if (!docs[i][1]) ok++; i++; draw(); };
  };
  const iv = setInterval(() => { const tb = $('#tb'); if (tb) tb.style.width = Math.max(0, 100 - (Date.now() - t0) / T * 100) + '%'; if (Date.now() - t0 > T) { clearInterval(iv); if (i < docs.length) done(); } }, 100);
  let fin = false;
  const done = () => {
    if (fin) return; fin = true; clearInterval(iv);
    const miss = docs.length - i;
    S.s.p += ok - 2 - miss; S.s.c += bad.some(b => b[2] === '關說條子') ? 4 : 0; S.s.k += bad.some(b => b[2] === '關說條子') ? 6 : 0; S.s.m -= bad.filter(b => /0 元|重複/.test(b[0])).length * 6;
    sheet(`<h2>📑 批完了：${ok}/5 正確</h2>${bad.length ? bad.map(b => `<div class="goal">😱 你核可了「${b[0]}」<br><small class="muted">${b[2]}</small></div>`).join('') : ''}${miss ? `<div class="goal">⏰ 還有 ${miss} 份沒批，公文旅行去了</div>` : ''}${!bad.length && !miss ? '<div class="goal">✨ 一份都沒放過，承辦人嚇到了</div>' : ''}<button class="btn" id="x">繼續</button>`, d => d.querySelector('#x').onclick = () => { d.remove(); tick(); next(); });
  };
  draw();
}
const QS = [['市長，請問捷運什麼時候通？', 1], ['市長，下週的行程方便說嗎？', 1], ['市長，您覺得 N 城的貓多嗎？', 1], ['市長，您的口袋……', 0], ['網傳你跟廠商吃飯？', 0], ['你兒子是不是……（離題了）', 0], ['你今天領帶是哪買的？', 1], ['聽說你要選總統？', 0], ['方議員說你說謊？', 0]];
function micGame() {
  let hit = 0, wrong = 0, missed = 0, n = 0, fin = false;
  const t0 = Date.now(), T = 10000;
  app.innerHTML = `${statsHtml()}<div class="mg"><h2>🎤 記者會擋麥克風</h2><div class="muted">10 秒內，點掉🟥紅色的地雷問題，藍色的讓它過</div><div class="timer"><b id="tb"></b></div><div class="field" id="fd"></div></div>`;
  const fd = $('#fd');
  const spawn = () => {
    if (fin) return;
    const q = pick(QS), b = document.createElement('button'); n++;
    b.className = 'q ' + (q[1] ? 'ok' : 'bad'); b.textContent = q[0];
    b.style.left = rnd(40) + '%'; b.style.top = rnd(80) + '%';
    b.onclick = () => { if (q[1]) wrong++; else hit++; b.remove(); };
    fd.appendChild(b);
    setTimeout(() => { if (b.parentNode) { if (!q[1]) missed++; b.remove(); } }, 1800);
  };
  const sp = setInterval(spawn, 700); spawn();
  const iv = setInterval(() => { const tb = $('#tb'); if (tb) tb.style.width = Math.max(0, 100 - (Date.now() - t0) / T * 100) + '%'; if (Date.now() - t0 > T) end(); }, 100);
  const end = () => {
    if (fin) return; fin = true; clearInterval(sp); clearInterval(iv);
    S.s.p += hit - missed - wrong; S.s.c += wrong ? -2 : 1;
    sheet(`<h2>🎤 記者會結束</h2><div class="goal">🛡️ 擋下 ${hit} 個地雷問題</div><div class="goal">💥 漏掉 ${missed} 個（明天上頭條）</div><div class="goal">🙊 擋錯 ${wrong} 個好問題（被說「不敢回答」）</div><button class="btn" id="x">繼續</button>`, d => d.querySelector('#x').onclick = () => { d.remove(); tick(); next(); });
  };
}

// ---------- 結局 → 下一任 ----------
function ending(id) {
  clearInterval(timerId);
  const E = ENDS[id], newEnd = !SV.ends.includes(id);
  if (newEnd) SV.ends.push(id);
  const gotGoals = S.goals.filter(g => GOALS[g][2]()), newUnlock = gotGoals.filter(g => !SV.unlock.includes(g));
  SV.unlock = SV.unlock.concat(newUnlock);
  const titles = Object.keys(TITLES).filter(t => TITLES[t][2]()), newT = titles.filter(t => !SV.titles.includes(t));
  SV.titles = SV.titles.concat(newT); SV.terms++; save();
  const fixed = Object.values(S.site).filter(v => v === 'fixed').length;
  app.innerHTML = `<div class="ending"><img src="${S.face}${id === 'win' || id === 'p100' ? 'big' : 'sad'}.webp" style="width:84px;height:84px;border-radius:50%" alt=""><div class="bigE">${E[0]}</div><h2>${E[1]}${newEnd ? ' 🆕' : ''}</h2><p>${E[2]}</p>
    <div class="muted">第 ${S.term} 任市長・在任 ${Math.floor(S.n / 24) ? Math.floor(S.n / 24) + ' 年 ' : ''}${Math.floor(S.n / 2) % 12} 個月・修好 ${fixed} 個地方</div>
    <div class="card" style="text-align:left">${S.goals.map(g => `<div class="goal"><span>${GOALS[g][2]() ? '✅' : '⬜'} ${GOALS[g][1]}${newUnlock.includes(g) ? `<br><small style="color:var(--green)">🔓 解鎖新角色：${GOALS[g][3]}</small>` : ''}</span></div>`).join('')}</div>
    ${titles.length ? `<div class="card">${titles.map(t => `${TITLES[t][0]} ${TITLES[t][1]}${newT.includes(t) ? ' 🆕' : ''}`).join('　')}</div>` : ''}
    <button class="btn" id="again">下一任市長 →</button><button class="btn ghost" id="gal">📖 圖鑑</button></div>`;
  $('#again').onclick = () => newGame(false);
  $('#gal').onclick = gallery;
}
function gallery() {
  sheet(`<h2>📖 圖鑑</h2><div class="muted">結局 ${SV.ends.length}/${Object.keys(ENDS).length}</div><div class="gal">${Object.keys(ENDS).map(k => `<div class="${SV.ends.includes(k) ? '' : 'no'}"><b>${SV.ends.includes(k) ? ENDS[k][0] : '❓'}</b>${SV.ends.includes(k) ? ENDS[k][1] : '？？？'}</div>`).join('')}</div>
    <h2 style="margin-top:14px">稱號 ${SV.titles.length}/${Object.keys(TITLES).length}</h2><div class="gal">${Object.keys(TITLES).map(k => `<div class="${SV.titles.includes(k) ? '' : 'no'}"><b>${TITLES[k][0]}</b>${SV.titles.includes(k) ? TITLES[k][1] : '？？？'}</div>`).join('')}</div>
    <h2 style="margin-top:14px">解鎖的角色 ${SV.unlock.length}/${Object.keys(GOALS).length}</h2><div class="gal">${Object.keys(GOALS).map(k => `<div class="${SV.unlock.includes(k) ? '' : 'no'}"><b>${GOALS[k][0]}</b>${SV.unlock.includes(k) ? GOALS[k][3] : GOALS[k][1]}</div>`).join('')}</div>
    <button class="btn" id="x">關閉</button>`, d => d.querySelector('#x').onclick = () => d.remove());
}

// ---------- 標題 ----------
function title() {
  app.innerHTML = `<h1>🏙️ 修城市</h1><p class="center muted">《我推的市長》系列・試玩版 0.3（左右滑）</p>
    <div class="card"><p><b>你是剛選上的 N 城市長。</b>百廢待舉。</p><p>里長、議員、局長、記者、廠商……每個人都帶著一句話來找你。<b>往右滑答應，往左滑拒絕。</b></p><p>民意、議會、財政、城市，太高太低都會出事；口袋滿了，一定會被查。</p></div>
    <button class="btn" id="go">${SV.terms ? `第 ${SV.terms + 1} 任市長上任 →` : '上任（有教學）→'}</button>${SV.terms ? '<button class="btn ghost" id="tut">重看教學</button><button class="btn ghost" id="gal">📖 圖鑑</button>' : ''}
    <p class="center muted">人物、政黨、城市全部虛構・摩卡與貓貓小隊<br><a href="v02.html" style="color:inherit">舊版 0.2</a>・<a href="v03map.html" style="color:inherit">地圖版</a></p>`;
  $('#go').onclick = () => newGame(!SV.terms);
  if ($('#tut')) $('#tut').onclick = () => newGame(true);
  if ($('#gal')) $('#gal').onclick = gallery;
}
document.addEventListener('keydown', e => { if (!CUR || !$('#card')) return; if (e.key === 'ArrowLeft' && CUR.tut !== 'R') choose('L'); if (e.key === 'ArrowRight' && CUR.tut !== 'L') choose('R'); });
title();
</script>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>災難看板（試玩版）</title>
<style>
:root { --bg: #f6efe0; --ink: #2b2f36; --muted: #7a7466; --line: #e4d9c3; --grn: #2e8b57; --yel: #e0a526; --red: #c0392b; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; touch-action: manipulation; }
#app { max-width: 480px; margin: 0 auto; padding: 10px 12px 24px; min-height: 100vh; }
h1 { text-align: center; font-size: 28px; margin: 30px 0 6px; }
h2 { font-size: 20px; margin: 8px 0; }
.muted { color: var(--muted); font-size: 13px; }
.center { text-align: center; }
.btn { display: block; width: 100%; border: 0; border-radius: 999px; padding: 14px; margin: 10px 0; font-size: 17px; font-weight: 700; background: var(--ink); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
.card { background: #fffaf0; border: 2px solid var(--line); border-radius: 16px; padding: 12px; margin: 10px 0; }
/* 頂部 */
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-bottom: 6px; }
.row { display: flex; align-items: center; gap: 8px; }
.round { font-weight: 800; }
.clock { margin-left: auto; font-weight: 800; font-size: 20px; }
.clock.low { color: var(--red); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
.st { font-size: 12px; text-align: center; }
.st .bar { height: 7px; background: #e4d9c3; border-radius: 4px; overflow: hidden; margin-top: 2px; }
.st .bar div { height: 100%; transition: width .3s; }
.hint { background: var(--ink); color: #fff; border-radius: 10px; padding: 7px 10px; font-size: 13px; font-weight: 700; margin-top: 6px; }
/* 火 */
.fires { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 120px; }
.fire { position: relative; background: #fff; border: 2px solid #f0c9b8; border-radius: 14px; padding: 8px 10px; transition: transform .1s; }
.fire.lv2 { border-color: #e98c6a; background: #fff4ee; }
.fire.lv3 { border-color: var(--red); background: #ffe9e3; animation: pulse 1s infinite; }
.fire.pledge { border-color: #9fc6a8; background: #f1faf3; }
.fire.drop { transform: scale(1.03); box-shadow: 0 0 0 3px #ffd166; }
.fire.done { opacity: .5; }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px rgba(192, 57, 43, .25); } }
.fire .t { font-weight: 700; font-size: 15px; }
.fire .need { font-size: 11px; color: var(--muted); }
.meters { display: flex; gap: 6px; margin-top: 5px; align-items: center; font-size: 11px; color: var(--muted); }
.m { flex: 1; height: 6px; background: #eee; border-radius: 3px; overflow: hidden; }
.m div { height: 100%; }
.m.heat div { background: #e98c6a; }
.m.time div { background: #7a6ba8; }
.m.prog div { background: var(--grn); }
.slots { display: flex; gap: 4px; margin-top: 5px; min-height: 30px; }
.chip { display: inline-flex; align-items: center; gap: 3px; background: #f3e6d0; border-radius: 999px; padding: 3px 8px; font-size: 12px; }
/* 團隊 */
.team { position: fixed; left: 0; right: 0; bottom: 0; background: #fffaf0; border-top: 2px solid var(--line); padding: 8px 10px 12px; z-index: 6; }
.team .in { max-width: 480px; margin: 0 auto; }
.people { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.p { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 4px 2px; text-align: center; font-size: 22px; touch-action: none; user-select: none; }
.p small { display: block; font-size: 9px; color: var(--muted); line-height: 1.2; }
.p .sp { font-size: 9px; background: #e3e9f7; color: #33508f; border-radius: 6px; padding: 0 3px; }
.p.sel { border-color: var(--yel); background: #fff6df; }
.p.busy { opacity: .55; }
.p.off { opacity: .3; }
.locked { font-size: 10px; color: #a39b8a; margin-top: 4px; text-align: center; }
.ghost { position: fixed; pointer-events: none; font-size: 30px; z-index: 50; transform: translate(-50%, -50%); }
.toast { position: fixed; left: 50%; top: 90px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 12px; font-size: 13px; z-index: 40; max-width: 90vw; animation: fade 2.6s forwards; }
@keyframes fade { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
/* 結果 */
.story { font-size: 17px; line-height: 1.6; font-weight: 700; }
.log div { font-size: 14px; padding: 3px 0; }
.post { border-top: 1px solid #f0e8d8; padding: 6px 0; font-size: 14px; }
.post b { font-size: 12px; color: #6b5a33; display: block; }
.delta { font-size: 13px; margin-top: 6px; }
.delta span { margin-right: 10px; font-weight: 700; }
.up { color: var(--grn); } .down { color: var(--red); }
.member { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f0e8d8; font-size: 14px; }
.member .e { font-size: 24px; }
.member .x { margin-left: auto; border: 2px solid var(--red); color: var(--red); background: #fff; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
.ending { text-align: center; }
.ending .big { font-size: 64px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// ==========================================================
// 災難看板（試玩版）— 你是剛選上的市長。選上才是災難的開始。
// 每回合 30 秒：點一個人、再點一團火（或直接拖過去），派人滅火。
// 摩卡與貓貓小隊
// ==========================================================
const $ = s => document.querySelector(s), app = $('#app');
const rnd = n => Math.floor(Math.random() * n), pick = a => a[rnd(a.length)];
const shuffle = a => a.slice().sort(() => Math.random() - .5);
const ROUNDS = 8, ROUND_SEC = 30;
const SPEED = +new URLSearchParams(location.search).get('speed') || 1; // 測試用：?speed=5 讓時間跑快一點
const DT = 0.1 * SPEED;
const LABELS = [ '第 1 年・就職', '第 1 年・春', '第 1 年・颱風季', '第 1 年・預算季', '第 2 年', '第 3 年・期中考', '第 4 年・選前半年', '連任前夕' ];
const SPECS = { eng: '工程', fin: '財務', cou: '議會', med: '媒體', soc: '社福', tra: '交通' };

// ---------- 火：每一家族有 3 段（沒人管就升級）----------
// need：需要的專長；heat：要花多少力氣；sec：倒數秒數；fx：滅掉／燒成災難的影響
const FIRES = [
  { id: 'metro', e: '🚇', need: 'tra', st: ['捷運延伸線又延期了', '通車典禮取消，紀念商品已經在賣', '議員要求捷運局長下台'] },
  { id: 'council', e: '🏛️', need: 'cou', st: ['議員在質詢台拍桌', '議會拒審總預算（政見全卡住）', '預算被刪 30 億'], blocks: 1 },
  { id: 'contract', e: '📜', need: 'fin', st: ['前任簽的十年合約爆了', '廠商說提前解約要賠一大筆', '議員質疑：分手費誰付？'] },
  { id: 'crisp', e: '🧵', need: 'med', st: ['脆上又在吵', '吵上熱搜第一', '名嘴開始連播三天'] },
  { id: 'lunch', e: '🍱', need: 'soc', st: ['營養午餐團膳流標', '家長群組炸了', '學生吃泡麵上了新聞'] },
  { id: 'elder', e: '🧓', need: 'soc', st: ['敬老卡加碼，錢不夠', '長輩在市府門口陳情', '「市長翻臉不認帳」上頭版'] },
  { id: 'museum', e: '🏛', need: 'fin', st: ['紀念館只剩冷氣在上班', '議員拍影片：上週只來 11 人', '監察院來函'] },
  { id: 'skywalk', e: '🌉', need: 'eng', st: ['天空步道封閉半年', '工地只有一台怪手在睡覺', '「怪手睡覺」變成迷因'] },
  { id: 'stadium', e: '🏟️', need: 'eng', st: ['體育場草皮積水', '國際賽要移場', '「丟臉丟到國外」'] },
  { id: 'app', e: '📱', need: 'med', st: ['發券 App 開放 3 秒就當機', '「市府 App 3 秒當機」上熱搜', '資安專家說：那不是攻擊，是流量'] },
  { id: 'pole', e: '🪵', need: 'eng', st: ['一根廢棄電線桿，五個單位踢皮球', '里長在臉書幫電線桿慶生', '電線桿上了晚間新聞'] },
  { id: 'mascot', e: '🧸', need: 'med', st: ['議員舉牌考市長吉祥物名字', '40 多隻吉祥物上新聞', '「市長認不出自己的吉祥物」'] },
  { id: 'leak', e: '🕵️', need: 'cou', st: ['市政會議內容外流', '前任在臉書評論你們的計畫', '「市府有內鬼」'] },
  { id: 'concert', e: '🎤', need: 'fin', st: ['場租 0 元的演唱會，門票 3800', '記者算出場租應該多少', '議員：圖利！'] },
  { id: 'protest', e: '📢', need: 'soc', st: ['里長帶陳情團到市府', '陳情團在大廳打地舖', '陳情變成靜坐'] },
  { id: 'bus', e: '🚌', need: 'tra', st: ['新公車路線被罵翻', '司機說路線根本開不過去', '公車卡在巷子裡上新聞'] }
];
const SEASON = { 2: { id: 'typhoon', e: '🌀', need: 'eng', st: ['颱風明天到', '颱風假放不放？全市在等', '低窪地區淹水了'], sec: 0.7 }, 3: { id: 'budget', e: '💰', need: 'fin', st: ['預算季：議員排隊要建設', '總預算卡在議會', '預算被刪，局處停擺'] }, 5: { id: 'midterm', e: '🗳️', need: 'cou', st: ['期中考：同黨議員要你站台', '不站台被說不挺自己人', '黨內開始說要換人選'] } };
const PLEDGES = [ { id: 'housing', e: '🏘️', t: '政見：社會住宅' }, { id: 'busnew', e: '🚌', t: '政見：公車路線大翻新' }, { id: 'daycare', e: '🧸', t: '政見：公共托嬰加倍' }, { id: 'park', e: '🌳', t: '政見：每區一座共融公園' } ];

// ---------- 人：三位副市長＋三位局長，各有專長；真面目隱藏 ----------
const ROSTER = [
  { e: '👨‍💼', n: '周副市長', sp: 'cou' }, { e: '👩‍💼', n: '林副市長', sp: 'fin' }, { e: '🧑‍💼', n: '陳副市長', sp: 'soc' },
  { e: '👷', n: '工務局長', sp: 'eng' }, { e: '🚦', n: '交通局長', sp: 'tra' }, { e: '📣', n: '新聞處長', sp: 'med' }
];
const SPARE = [ { e: '🧓', n: '資深文官', sp: 'cou' }, { e: '🎓', n: '學者局長', sp: 'fin' }, { e: '🙋', n: '新任局長', sp: 'eng' }, { e: '👩‍🔧', n: '鄰市來的局長', sp: 'tra' }, { e: '🗞️', n: '前記者', sp: 'med' }, { e: '🤝', n: '社工出身的局長', sp: 'soc' } ];
const TRAITS = {
  good: { w: 34, n: '靠得住', tip: '' },
  pro: { w: 14, n: '超能幹', tip: '三分鐘就搞定，大家都嚇一跳' },
  credit: { w: 13, n: '很會搶功', tip: '在記者會上說火是他滅的' },
  blame: { w: 13, n: '一直推責任', tip: '火燒起來時，說是你交辦不清楚' },
  image: { w: 13, n: '形象派不做事', tip: '拍了一支影片，火還在燒' },
  vendor: { w: 13, n: '跟廠商走太近', tip: '被拍到跟廠商吃飯' }
};
const pickTrait = () => { const L = Object.entries(TRAITS); let x = Math.random() * L.reduce((a, [, t]) => a + t.w, 0); for (const [k, t] of L) { x -= t.w; if (x < 0) return k; } return 'good'; };
const mkPerson = (b, i) => ({ id: 'p' + i + '_' + rnd(1e6), ...b, trait: pickTrait(), known: false, on: null, rest: 0 });

// ---------- 狀態 ----------
let S = null;
function newGame() {
  S = { round: 0, pop: 50, council: 50, budget: 50, team: ROSTER.map(mkPerson), fires: [], log: [], disasters: 0, put: 0, pledgesDone: 0, pledgePool: shuffle(PLEDGES).slice(0, 3), history: [] };
}
const STATS = [ ['pop', '😊 民意'], ['council', '🏛️ 議會'], ['budget', '💰 財政'] ];
const clamp = v => Math.max(0, Math.min(100, v));
function addFx(fx, why) { for (const k in fx) S[k] = clamp(S[k] + fx[k]); if (why) S.log.push(why); }

// ---------- 開火 ----------
function spawnFire(fam, lvl = 0) {
  const base = 12 + lvl * 6 + rnd(6);
  const sec = Math.round((14 + rnd(10)) * (fam.sec || 1));
  S.fires.push({ uid: 'f' + rnd(1e9), fam, lvl, heat: base, max: base, sec, secMax: sec, done: false });
}
function spawnPledge() {
  const p = S.pledgePool.find(x => !x.done && !S.fires.some(f => f.pledge && f.p.id === x.id));
  if (!p) return;
  S.fires.push({ uid: 'g' + rnd(1e9), pledge: true, p, heat: 0, max: 30, prog: 0, done: false });
}
function startRound() {
  S.round++; S.log = []; S.events = { put: [], burned: [], credit: [] };
  S.team.forEach(p => { p.on = null; if (p.rest) p.rest--; });
  // 新的火：2～3 團＋季節；前一回合沒滅的火已經升級留下來
  const live = S.fires.filter(f => !f.done && !f.pledge).map(f => f.fam.id);
  const pool = shuffle(FIRES.filter(f => !live.includes(f.id)));
  const n = Math.min(6 - S.fires.filter(f => !f.done && !f.pledge).length, S.round === 1 ? 3 : 2 + (S.round > 4 ? 1 : 0));
  for (let i = 0; i < Math.max(1, n); i++) spawnFire(pool[i]);
  if (SEASON[S.round] && !live.includes(SEASON[S.round].id)) spawnFire(SEASON[S.round]);
  if (!S.fires.some(f => f.pledge && !f.done)) spawnPledge();
  S.t = ROUND_SEC; S.sel = null; S.midSpawned = false;
  renderBoard();
  S.timer = setInterval(tick, 100);
}

// ---------- 每 0.1 秒 ----------
function power(p, f) {
  let w = f.pledge ? 1 : (p.sp === f.fam.need ? 2 : 1);
  if (p.trait === 'pro') w *= 1.6;
  if (p.trait === 'image') w *= 0.4;
  return w;
}
function reveal(p) {
  if (p.known || p.trait === 'good') { p.known = true; return; }
  p.known = true; toast(`😳 ${p.n} 的真面目：${TRAITS[p.trait].n}——${TRAITS[p.trait].tip}`);
}
function tick() {
  S.t -= DT;
  const blocked = S.fires.some(f => !f.done && f.fam && f.fam.blocks && f.lvl >= 1);
  for (const f of S.fires) {
    if (f.done) continue;
    const crew = S.team.filter(p => p.on === f.uid);
    if (f.pledge) {
      if (!blocked) f.prog += crew.reduce((a, p) => a + power(p, f), 0) * DT;
      if (f.prog >= f.max) { f.done = true; f.p.done = true; S.pledgesDone++; addFx({ pop: 8, council: 2 }, `✂️ ${f.p.t.replace('政見：', '')} 完工剪綵！`); crew.forEach(p => { p.on = null; if (p.trait === 'credit') { S.events.credit.push(p.n); addFx({ pop: -4 }); } }); if (crew.some(p => p.trait === 'credit')) toast(`📸 ${crew.find(p => p.trait === 'credit').n} 搶在你前面剪綵`); }
      continue;
    }
    f.sec -= DT;
    f.heat -= crew.reduce((a, p) => a + power(p, f), 0) * DT;
    if (crew.length) crew.forEach(p => { if (!p.touched) { p.touched = true; if (p.trait === 'image') { reveal(p); addFx({ pop: 1 }); } } });
    if (f.heat <= 0) {
      f.done = true; S.put++; S.events.put.push(f);
      const gain = { pop: 2 + f.lvl, council: f.fam.need === 'cou' ? 2 : 0 };
      if (crew.some(p => p.trait === 'credit')) { const c = crew.find(p => p.trait === 'credit'); reveal(c); gain.pop = 0; S.events.credit.push(c.n); }
      addFx(gain);
      crew.forEach(p => { if (p.trait === 'pro') reveal(p); p.on = null; });
      const v = crew.find(p => p.trait === 'vendor');
      if (v && Math.random() < 0.6) { reveal(v); spawnFire({ id: 'scandal_' + v.id, e: '🍽️', need: 'cou', st: [`${v.n}跟廠商吃飯被拍`, '政風處介入調查', '檢調約談'] }); }
    } else if (f.sec <= 0) escalate(f, crew);
  }
  // 回合中段再冒一團火
  if ((!S.midSpawned && S.t < ROUND_SEC * 0.6) || (S.midSpawned === 1 && S.round > 4 && S.t < ROUND_SEC * 0.3)) { S.midSpawned = (S.midSpawned || 0) + 1; const live = S.fires.filter(f => !f.done).map(f => f.fam && f.fam.id); const fam = shuffle(FIRES).find(x => !live.includes(x.id)); if (fam && S.fires.filter(f => !f.done && !f.pledge).length < 6) { spawnFire(fam); toast(`🔥 新的災難：${fam.st[0]}`); } }
  if (S.t <= 0) return endRound();
  renderLive();
}
function escalate(f, crew) {
  const blamer = crew.find(p => p.trait === 'blame');
  if (blamer) { reveal(blamer); addFx({ council: -3 }); }
  if (f.lvl >= 2) {
    // 燒成災難
    f.done = true; f.burned = true; S.disasters++; S.events.burned.push(f);
    addFx({ pop: -6, council: -4, budget: -5 });
    crew.forEach(p => p.on = null);
    toast(`💥 燒成災難：${f.fam.st[2]}`);
    return;
  }
  f.lvl++; f.heat = f.max = 12 + f.lvl * 6 + rnd(6); f.secMax = f.sec = 14 + rnd(8);
  addFx({ pop: -1 });
  toast(`🔥 升級：${f.fam.st[f.lvl]}`);
}
function endRound() {
  clearInterval(S.timer);
  // 沒滅的火留到下回合，倒數接著跑（會繼續長大）
  S.fires = S.fires.filter(f => !f.done);
  addFx({ budget: 3 });
  S.history.push({ round: S.round, put: S.events.put.length, burned: S.events.burned.length });
  if (S.pop <= 0 || S.council <= 0) return endingScreen(true);
  resultScreen();
}

// ---------- 畫面：看板 ----------
function statBar() {
  return `<div class="stats">${STATS.map(([k, n]) => { const v = S[k], c = v < 25 ? 'var(--red)' : v < 45 ? 'var(--yel)' : 'var(--grn)'; return `<div class="st">${n} ${Math.round(v)}<div class="bar"><div style="width:${v}%;background:${c}"></div></div></div>`; }).join('')}</div>`;
}
function renderBoard() {
  app.innerHTML = `<div class="top"><div class="row"><span class="round">${LABELS[S.round - 1]}</span><span class="muted">${S.round}/${ROUNDS}</span><span class="clock" id="clock"></span></div>${statBar()}<div class="hint" id="hint"></div></div>
    <div class="fires" id="fires"></div>
    <div class="team"><div class="in"><div class="people" id="people"></div><div class="locked">🔒 主計・人事・警察・政風：依法不是市長換的</div></div></div>`;
  renderLive();
}
function renderLive() {
  const c = $('#clock'); if (!c) return;
  c.textContent = `⏱ ${Math.max(0, S.t).toFixed(0)}s`; c.className = 'clock' + (S.t < 8 ? ' low' : '');
  $('#hint').textContent = S.sel ? `👉 把 ${S.team.find(p => p.id === S.sel).n} 派到哪一團火？點那張卡` : '👉 點一個人，再點一團火（也可以直接拖過去）';
  const blocked = S.fires.some(f => !f.done && f.fam && f.fam.blocks && f.lvl >= 1);
  $('#fires').innerHTML = S.fires.filter(f => !f.done).map(f => {
    const crew = S.team.filter(p => p.on === f.uid);
    if (f.pledge) return `<div class="fire pledge" data-f="${f.uid}"><div class="t">${f.p.e} ${f.p.t}</div><div class="need">${blocked ? '⛔ 議會拒審中，政見推不動' : '派人推進度（誰都可以）'}</div><div class="meters">進度<div class="m prog"><div style="width:${f.prog / f.max * 100}%"></div></div></div><div class="slots">${crew.map(p => `<span class="chip" data-un="${p.id}">${p.e}${p.n}</span>`).join('')}</div></div>`;
    return `<div class="fire lv${f.lvl + 1}" data-f="${f.uid}"><div class="t">${f.fam.e} ${f.fam.st[f.lvl]}</div><div class="need">需要：${SPECS[f.fam.need]}${f.lvl ? `・升級 ${f.lvl} 次` : ''}</div>
      <div class="meters">火勢<div class="m heat"><div style="width:${Math.max(0, f.heat / f.max * 100)}%"></div></div>倒數<div class="m time"><div style="width:${Math.max(0, f.sec / f.secMax * 100)}%"></div></div></div>
      <div class="slots">${crew.map(p => `<span class="chip" data-un="${p.id}">${p.e}${p.n}${p.sp === f.fam.need ? '⚡' : ''}</span>`).join('')}</div></div>`;
  }).join('');
  $('#people').innerHTML = S.team.map(p => `<div class="p ${S.sel === p.id ? 'sel' : ''} ${p.on ? 'busy' : ''} ${p.rest ? 'off' : ''}" data-p="${p.id}">${p.e}<small>${p.n}</small><span class="sp">${SPECS[p.sp]}</span>${p.known && p.trait !== 'good' ? `<small>😳${TRAITS[p.trait].n}</small>` : ''}</div>`).join('');
  bind();
}
function assign(pid, fid) {
  const p = S.team.find(x => x.id === pid), f = S.fires.find(x => x.uid === fid);
  if (!p || !f || p.rest) return;
  p.on = fid; S.sel = null;
}
function bind() {
  document.querySelectorAll('[data-f]').forEach(el => el.onclick = e => { if (e.target.closest('[data-un]')) return; if (S.sel) { assign(S.sel, el.dataset.f); renderLive(); } });
  document.querySelectorAll('[data-un]').forEach(el => el.onclick = () => { const p = S.team.find(x => x.id === el.dataset.un); if (p) p.on = null; renderLive(); });
  document.querySelectorAll('[data-p]').forEach(el => {
    el.onpointerdown = e => startDrag(e, el.dataset.p);
  });
}
// 拖曳：按住人拖到火上；只是點一下就當成「選取」
function startDrag(e, pid) {
  const p = S.team.find(x => x.id === pid); if (!p || p.rest) return;
  const sx = e.clientX, sy = e.clientY; let g = null, over = null, moved = false;
  const mv = ev => {
    if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) { moved = true; g = document.createElement('div'); g.className = 'ghost'; g.textContent = p.e; document.body.appendChild(g); }
    if (!moved) return;
    g.style.left = ev.clientX + 'px'; g.style.top = ev.clientY + 'px';
    const el = document.elementFromPoint(ev.clientX, ev.clientY), f = el && el.closest('[data-f]');
    if (over && over !== f) over.classList.remove('drop');
    over = f; if (f) f.classList.add('drop');
  };
  const up = () => {
    window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up);
    if (g) g.remove();
    if (moved && over) assign(pid, over.dataset.f);
    else if (!moved) S.sel = S.sel === pid ? null : pid;
    renderLive();
  };
  window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
}
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

// ---------- 回合結果：一句劇情＋脆＋少量數字 ----------
const USERS = ['捷運通勤的阿凱', '早餐店阿姨', '貓奴工程師', '外送員小陳', '退休國文老師', '機車族日常', '三寶媽在線上', '里長的頭號粉絲', '熬夜的研究生', '市場賣菜的大姊', '計程車運將', '咖啡店店長'];
function storyOf(ev) {
  if (ev.burned.length >= 2) return `兩團火同時燒成災難，記者在市府門口連線一整天。`;
  if (ev.burned.length === 1) return `「${ev.burned[0].fam.st[2]}」——這一季大家只記得這件事。`;
  if (ev.credit.length) return `火是你們滅的，但記者會上站在中間的是${ev.credit[0]}。`;
  if (ev.put.length >= 4) return `這一季手忙腳亂，但居然都撐住了。秘書長說：「很少見。」`;
  if (ev.put.length === 0) return `一團火都沒滅，大家都在開會。`;
  return `滅了 ${ev.put.length} 團火，剩下的明天會更大。`;
}
function resultScreen() {
  const ev = S.events, start = S.history.length > 1 ? null : null;
  const mood = ev.burned.length ? 'down' : 'up';
  const lines = { up: ['欸這季還可以', '第一次覺得市府有在做事', '先給個讚，看後續', '有比前任好一點點'], down: ['市府到底在幹嘛', '笑死，又來', '選上就這樣？', '四年很快就過了喔'], mid: ['方向對啦，但也太慢', '先不要高興太早', '好壞參半'] };
  const us = shuffle(USERS);
  const team = S.team.map(p => `<div class="member"><span class="e">${p.e}</span><div><b>${p.n}</b>（${SPECS[p.sp]}）<br><small class="muted">${p.known ? (p.trait === 'good' ? '靠得住' : '😳 ' + TRAITS[p.trait].n) : '真面目還不知道'}${p.rest ? '・剛到任，下回合才能派' : ''}</small></div>${p.known && p.trait !== 'good' && p.trait !== 'pro' ? `<button class="x" data-x="${p.id}">換掉</button>` : ''}</div>`).join('');
  app.innerHTML = `<div class="top"><div class="row"><span class="round">${LABELS[S.round - 1]}・結束</span></div>${statBar()}</div>
    <div class="card"><div class="story">${storyOf(ev)}</div>
      <div class="log">${ev.put.map(f => `<div>✅ ${f.fam.e} 滅了：${f.fam.st[f.lvl]}</div>`).join('')}${ev.burned.map(f => `<div class="down">💥 燒成災難：${f.fam.st[2]}</div>`).join('')}${S.log.map(l => `<div>${l}</div>`).join('')}</div></div>
    <div class="card"><div class="muted">🧵 脆上的反應</div>
      <div class="post"><b>${us[0]}</b>${pick(lines[mood])}</div><div class="post"><b>${us[1]}</b>${pick(lines.mid)}</div></div>
    <div class="card"><b>👥 你的團隊</b><div class="muted">用過才知道真面目。換人要花一回合，也會被說內閣不穩（民意 −3）。</div>${team}</div>
    <button class="btn" id="go">${S.round >= ROUNDS ? '看結局 →' : `下一回合：${LABELS[S.round]} →`}</button>`;
  document.querySelectorAll('[data-x]').forEach(b => b.onclick = () => {
    const i = S.team.findIndex(p => p.id === b.dataset.x); const old = S.team[i];
    const base = SPARE.find(x => x.sp === old.sp) || pick(SPARE);
    S.team[i] = { ...mkPerson(base, i), rest: 1 };
    addFx({ pop: -3 });
    toast(`🔁 換掉 ${old.n}。記者：「新市府內閣不穩？」`);
    resultScreen();
  });
  $('#go').onclick = () => S.round >= ROUNDS ? endingScreen(false) : startRound();
}

// ---------- 結局 ----------
function endingScreen(early) {
  const score = S.pop * 0.5 + S.council * 0.3 + S.budget * 0.2 + S.pledgesDone * 8 - S.disasters * 3;
  const E = early ? { e: '🪧', t: '被罷免了', d: '民意或議會歸零，罷免案通過。選上真的是災難的開始。' }
    : score >= 60 ? { e: '🌤️', t: '連任成功', d: `四年滅了 ${S.put} 團火，兌現 ${S.pledgesDone} 個政見。連任那晚，你想起就職那天的抽屜。` }
    : score >= 42 ? { e: '😮‍💨', t: '驚險連任', d: `贏了，但只贏一點點。燒成災難的有 ${S.disasters} 團，大家都還記得。` }
    : { e: '📦', t: '一任市長', d: `四年過去，${S.disasters} 團火燒成災難。下一任市長打開抽屜，看到的是你留下的東西。` };
  const fake = S.team.filter(p => p.trait !== 'good');
  app.innerHTML = `<div class="ending"><div class="big">${E.e}</div><h2>${E.t}</h2><p>${E.d}</p>
    <div class="card" style="text-align:left">🔥 滅火 ${S.put} 團・💥 燒成災難 ${S.disasters} 團・✂️ 政見 ${S.pledgesDone} 個<br>😳 團隊的真面目：${fake.length ? fake.map(p => `${p.n}（${TRAITS[p.trait].n}）`).join('、') : '大家都靠得住，難得'}</div>
    <button class="btn" id="again">🔁 再當一次市長</button></div>`;
  $('#again').onclick = () => { newGame(); startRound(); };
}

// ---------- 標題 ----------
function title() {
  app.innerHTML = `<h1>🔥 災難看板</h1><p class="center muted">《我推的市長》系列・試玩版</p>
    <div class="card"><p><b>你是剛選上的市長。</b>選上才是災難的開始。</p>
    <p>每回合 30 秒，看板上同時燒著好幾團火。<b>點一個人、再點一團火</b>（或直接拖過去）派人去滅。專長對了⚡滅得快。</p>
    <p>沒人管的火會升級，三段之後燒成災難。人永遠不夠用。</p>
    <p>你的副市長和局長各有<b>真面目</b>，用了才知道。</p></div>
    <button class="btn" id="go">上任 →</button><p class="center muted">摩卡與貓貓小隊・試玩版 0.1</p>`;
  $('#go').onclick = () => { newGame(); startRound(); };
}
title();
</script>
